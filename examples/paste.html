<!DOCTYPE html>
<style>
  html,
  body,
  textarea {
    width: 100%;
    height: 100%;
    padding: 0;
    margin: 0;
  }
</style>
<textarea id="paste" placeholder="Paste here!"></textarea>
<script type="module">
  // Import gdb
  import { gdb } from "../dist/index.js";

  // Initialize the database
  const db = await gdb("graphdb-paste", { rtc: true });

  // Get the <textarea> element
  const paste = document.getElementById("paste");

  // Unique ID for the textarea content
  const TEXTAREA_ID = "textarea-content";

  // Save on every keystroke: the write IS the sync
  paste.oninput = () => db.put({ content: paste.value }, TEXTAREA_ID);

  // Subscribe to that one node. The callback fires again on every change to it,
  // from this tab or from a peer — so the screen is drawn by the same path a
  // remote edit takes. Assigning an unchanged value would move the caret.
  db.get(TEXTAREA_ID, (node) => {
    const content = node?.value?.content ?? "";
    if (content !== paste.value) paste.value = content;
  });
</script>
