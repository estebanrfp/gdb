<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenosDB — From a form to a query</title>

    <style>
        /* Minimal profile: only the tokens this page paints with, same names and
           same values as the design guide. Light palette — this is an interface
           built to be learned, next to the documentation it illustrates. */
        :root {
            --bg-primary: #f4f6fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f3f7;
            --bg-elevated: #ffffff;
            --text-primary: #1a1d24;
            --text-secondary: #6b7280;
            --text-tertiary: #9aa1ad;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --ok: #16a34a;
            --danger: #dc2626;
            --text-on-accent: #ffffff;
            --border-subtle: #e4e7ee;
            --border-strong: #d4d9e3;
            --backdrop: rgba(26, 29, 36, .45);
            --radius-sm: 6px;
            --radius-lg: 14px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
            --panel-width: 320px;
        }

        /* Values only — not one component rule below changes with the theme. */
        [data-theme="dark"] {
            --bg-primary: #0d0f12;
            --bg-secondary: #14171c;
            --bg-tertiary: #1c2026;
            --bg-elevated: #22262d;
            --text-primary: #e8eaed;
            --text-secondary: #9aa3ad;
            --text-tertiary: #5c6570;
            --accent: #4c8dff;
            --accent-hover: #6ba1ff;
            --ok: #34c77b;
            --danger: #ef5350;
            --border-subtle: #262b33;
            --border-strong: #333a44;
            --backdrop: rgba(0, 0, 0, .6);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh; /* the mobile address bar is not part of the viewport */
            overflow: hidden;
            font: 14px/1.5 var(--font);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ── The catalogue bench, with a form in place of the catalogue ── */
        /* The left column's job in this family is to produce the query. In the
           other benches you pick one; here you compose it, and the field above
           the results shows what your choices add up to — rewritten on every
           keystroke, so the translation is the lesson rather than the result. */
        .layout {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            height: 100%;
        }

        /* Every chrome band is 48px tall — this one and the status bar read as
           one system rather than two near-misses. */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            min-height: 48px;
            padding: var(--space-2) var(--space-5);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand {
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -.01em;
        }

        .topbar-end { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }

        .current {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .current:empty { display: none; }

        .bench {
            display: grid;
            grid-template-columns: var(--panel-width) minmax(0, 1fr);
            min-height: 0;
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            border-right: 1px solid var(--border-subtle);
        }

        .panel-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-4) var(--space-4); }

        .group {
            margin: var(--space-5) 0 var(--space-3);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .group:first-child { margin-top: var(--space-3); }

        /* A field that is filling in part of the query says which part, in the
           operator's own name — the label is the lesson, not decoration. */
        .field { margin-bottom: var(--space-3); }

        .field label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .field label code { font-family: var(--mono); font-size: 11px; color: var(--text-tertiary); }

        .pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }

        .panel-foot { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-subtle); }
        .panel-foot button { flex: 1; }

        /* ── The bench itself ───────────────────────────────────── */
        .workbench {
            display: grid;
            /* The query row is a value the divider writes; the rest follows it. */
            grid-template-rows: var(--query-height, 140px) auto minmax(0, 1fr) auto;
            min-width: 0;
            min-height: 0;
        }

        .query-bar {
            display: grid;
            min-height: 0;
            padding: var(--space-4) var(--space-5) var(--space-2);
            overflow: hidden;
        }

        /* Read-only on purpose: this field is the form's output. Editing it by
           hand would put the two out of step, and which one won would be
           anyone's guess. The other benches in this family let you type here
           because there the field is the input. */
        #query-display {
            min-height: 0;
            padding: 0;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-secondary);
            background: none;
            border: none;
            outline: none;
            resize: none; /* the divider below resizes it, in the axis that matters */
            white-space: pre;
            overflow: auto;
        }

        /* ── The divider is the control ─────────────────────────── */
        /* The hit area is 11px tall while the line stays 1px: a 1px target is a
           target you miss. */
        .splitter {
            position: relative;
            height: 11px;
            cursor: row-resize;
            touch-action: none; /* or a touch drag scrolls the page instead */
        }

        .splitter::before {
            content: "";
            position: absolute;
            inset: 5px 0 auto;
            height: 1px;
            background: var(--border-subtle);
        }

        /* Two short bars centred on the line — the one mark that says a line can
           be moved. Its background covers the line behind it. */
        .splitter::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 28px;
            height: 5px;
            transform: translate(-50%, -50%);
            border-top: 1px solid var(--border-strong);
            border-bottom: 1px solid var(--border-strong);
            background: var(--bg-secondary);
        }

        .splitter:hover::after,
        .splitter:focus-visible::after { border-color: var(--accent); }
        .splitter:focus-visible { outline: none; }

        .results { min-height: 0; overflow-y: auto; padding: var(--space-5); }

        /* A grid of cells, not a deck of cards: a rule at the top of each one
           and the gap around it. People are read by scanning, so the columns
           earn their place. */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--space-4) var(--space-5);
        }

        .person {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            min-width: 0;
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-subtle);
        }

        .person img {
            flex: 0 0 40px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-tertiary);
        }

        .person-text { min-width: 0; }
        .person b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .person span { font-family: var(--mono); font-size: 12px; color: var(--text-tertiary); }

        /* The results panel is never blank: before the first search it says what
           will appear there. */
        .empty {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-tertiary);
            text-align: center;
        }

        .empty svg { width: 40px; height: 40px; margin-bottom: var(--space-3); }
        .empty p { margin: 0; }

        .hidden { display: none !important; }

        /* ── Status bar — what is true, never what you can do ───── */
        .statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            min-height: 48px;
            padding: var(--space-2) var(--space-5);
            border-top: 1px solid var(--border-subtle);
            font-size: 12px;
            color: var(--text-tertiary);
        }

        #status { font-family: var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #status.error { color: var(--danger); }
        #status.ok { color: var(--ok); }
        .note { white-space: nowrap; }

        /* ── Buttons and fields ─────────────────────────────────── */
        button {
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }

        button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-hover); }
        button:disabled { opacity: .5; cursor: not-allowed; }

        button.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
        button.ghost:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-strong); }

        button.danger { background: transparent; border-color: var(--border-strong); color: var(--danger); }
        button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

        input, select {
            width: 100%;
            padding: var(--space-2) var(--space-3);
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-secondary);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent); }

        /* Marks a field that is currently contributing to the query, so the
           connection between the left column and the field above the results is
           visible without reading the JSON. */
        input.active, select.active { border-color: var(--accent); }

        .icon-btn {
            display: flex;
            padding: 6px;
            margin-right: -6px; /* aligns the mark with the edge, not the hit area */
            background: none;
            border: none;
            color: var(--text-secondary);
        }

        .icon-btn:hover:not(:disabled) { color: var(--text-primary); border-color: transparent; }
        .icon-btn svg { width: 16px; height: 16px; }

        .icon-moon, .icon-system { display: none; }
        [data-pref="dark"] .icon-sun { display: none; }
        [data-pref="dark"] .icon-moon { display: block; }
        [data-pref="system"] .icon-sun { display: none; }
        [data-pref="system"] .icon-system { display: block; }

        /* ── Confirmation dialog ────────────────────────────────── */
        dialog {
            width: min(440px, calc(100vw - var(--space-6)));
            padding: var(--space-6);
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            text-align: center;
        }

        dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }

        .modal-title { margin: 0 0 var(--space-3); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
        .modal-hint { margin: 0 0 var(--space-5); font-size: 14px; color: var(--text-secondary); }
        .modal-actions { display: flex; flex-direction: column; gap: var(--space-2); }
        .modal-actions button { width: 100%; padding: 13px var(--space-4); font-size: 14px; font-weight: 600; }

        @media (max-width: 900px) {
            .bench { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 45%) minmax(0, 55%); }
            .panel { border-right: none; border-bottom: 1px solid var(--border-subtle); }
            .topbar, .query-bar, .results, .statusbar { padding-inline: var(--space-4); }
        }

        @media (max-width: 620px) {
            .note { display: none; }
        }
    </style>
</head>

<body>

    <div class="layout">
        <header class="topbar">
            <h1 class="brand">Search</h1>

            <div class="topbar-end">
                <span id="current" class="current"></span>

                <button id="theme-btn" class="icon-btn" title="Theme" aria-label="Theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                    </svg>
                    <svg class="icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="13" rx="2" />
                        <path d="M9 21h6" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="bench">
            <aside class="panel">
                <div class="panel-scroll">
                    <p class="group">Filters</p>

                    <div class="field">
                        <label for="f-name">Name contains <code>$regex</code></label>
                        <input type="text" id="f-name" placeholder="Any">
                    </div>

                    <div class="field">
                        <label for="f-country">Country <code>$eq</code></label>
                        <select id="f-country">
                            <option value="">Any</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="f-gender">Gender <code>$eq</code></label>
                        <select id="f-gender">
                            <option value="">Any</option>
                            <option value="female">Female</option>
                            <option value="male">Male</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="f-min-age">Age <code>$gte · $lte · $between</code></label>
                        <div class="pair">
                            <input type="number" id="f-min-age" placeholder="Min" min="0" max="120">
                            <input type="number" id="f-max-age" placeholder="Max" min="0" max="120">
                        </div>
                    </div>

                    <p class="group">Order</p>

                    <div class="field">
                        <div class="pair">
                            <select id="f-field" aria-label="Sort by">
                                <option value="name">By name</option>
                                <option value="age">By age</option>
                            </select>
                            <select id="f-order" aria-label="Direction">
                                <option value="asc">Ascending</option>
                                <option value="desc">Descending</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label for="f-limit">Limit <code>$limit</code></label>
                        <input type="number" id="f-limit" value="24" min="1" max="200">
                    </div>
                </div>

                <div class="panel-foot">
                    <button id="reload-btn">Reload people</button>
                    <button id="clear-btn" class="danger">Clear</button>
                </div>
            </aside>

            <section class="workbench">
                <div class="query-bar">
                    <textarea id="query-display" readonly spellcheck="false"
                        aria-label="The query these filters produce"></textarea>
                </div>

                <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal"
                    aria-label="Resize the query field" tabindex="0"></div>

                <div class="results">
                    <div id="empty-view" class="empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M20 20l-3.5-3.5" />
                        </svg>
                        <p id="empty-message">Move a filter and watch the query above rewrite itself.</p>
                    </div>
                    <div class="results-grid" id="results"></div>
                </div>

                <footer class="statusbar">
                    <span id="status">Starting…</span>
                    <span class="note">Every filter is optional — an empty form is an empty query</span>
                </footer>
            </section>
        </div>
    </div>

    <!-- Confirmation before anything irreversible. Never window.confirm: it
         blocks the thread, and a blocked thread cannot repaint. -->
    <dialog id="confirm-modal">
        <h2 class="modal-title" id="confirm-title"></h2>
        <p class="modal-hint" id="confirm-text"></p>
        <form method="dialog" class="modal-actions">
            <button value="ok" id="confirm-ok" class="danger"></button>
            <button value="cancel" class="ghost">Cancel</button>
        </form>
    </dialog>

    <script type="module">
        /**
         * From a form to a query.
         *
         * Every app with a search box has to solve this: a handful of optional
         * controls, and one query object assembled from whichever the reader
         * actually filled in. The other benches in this family hand you a query
         * to run; this one shows you how a query is *built* — the field above
         * the results is rewritten on every keystroke, so you can watch a filled
         * box become `{ country: { $eq: "Spain" } }` before you search.
         *
         * The pair of age boxes is the part worth watching: fill one and you get
         * `$gte` or `$lte`, fill both and the two collapse into a single
         * `$between`. That is the whole job of a query builder, in three lines.
         *
         * What to read here, and where:
         *   · buildQuery()        — the translation, and the only interesting code
         *   · db.map(options)     — query + field + order + $limit, one call
         *
         * The people are real records from a public API, so the values are not
         * arranged to make the filters look good.
         */
        import { gdb } from "../dist/index.js"

        const PEOPLE_COUNT = 50
        const PEOPLE_URL = `https://randomuser.me/api/?nat=es,us,mx&results=${PEOPLE_COUNT}&inc=name,dob,location,picture,gender`
        const COUNTRIES = ["Spain", "United States", "Mexico"]

        const $ = (id) => document.getElementById(id)
        const el = {
            themeBtn: $("theme-btn"),
            current: $("current"),
            name: $("f-name"),
            country: $("f-country"),
            gender: $("f-gender"),
            minAge: $("f-min-age"),
            maxAge: $("f-max-age"),
            field: $("f-field"),
            order: $("f-order"),
            limit: $("f-limit"),
            query: $("query-display"),
            workbench: document.querySelector(".workbench"),
            queryBar: document.querySelector(".query-bar"),
            splitter: $("splitter"),
            results: $("results"),
            emptyView: $("empty-view"),
            emptyMessage: $("empty-message"),
            status: $("status"),
            reload: $("reload-btn"),
            clear: $("clear-btn"),
            confirmModal: $("confirm-modal"),
            confirmTitle: $("confirm-title"),
            confirmText: $("confirm-text"),
            confirmOk: $("confirm-ok")
        }

        /** The status bar reports; `tone` only colours what it already says. */
        const setStatus = (message, tone = "") => {
            el.status.textContent = message
            el.status.className = tone
        }

        const confirmAction = ({ title, body, confirmLabel }) => new Promise((resolve) => {
            el.confirmTitle.textContent = title
            el.confirmText.textContent = body
            el.confirmOk.textContent = confirmLabel
            el.confirmModal.addEventListener(
                "close",
                () => resolve(el.confirmModal.returnValue === "ok"),
                { once: true } // Esc and the backdrop both land here, as a "no"
            )
            el.confirmModal.showModal()
        })

        // ── The divider ─────────────────────────────────────────────
        const MIN_QUERY_HEIGHT = 72
        const MIN_OUTPUT_HEIGHT = 140

        const setQueryHeight = (px, persist = true) => {
            // A workbench with no height yet cannot say what is too tall, and that
            // is exactly the state of the first paint: clamping against it would
            // pin the field to its minimum and store that as the preference.
            const available = el.workbench.clientHeight
            const ceiling = available ? Math.max(available - MIN_OUTPUT_HEIGHT, MIN_QUERY_HEIGHT) : Infinity
            const height = Math.round(Math.min(Math.max(px, MIN_QUERY_HEIGHT), ceiling))
            el.workbench.style.setProperty("--query-height", `${height}px`)
            if (persist) localStorage.searchQueryHeight = height
        }

        el.splitter.addEventListener("pointerdown", (event) => {
            event.preventDefault() // no text selection while dragging
            el.splitter.setPointerCapture(event.pointerId)

            const startY = event.clientY
            const startHeight = el.queryBar.getBoundingClientRect().height
            const onMove = (move) => setQueryHeight(startHeight + move.clientY - startY)

            el.splitter.addEventListener("pointermove", onMove)
            el.splitter.addEventListener(
                "pointerup",
                () => el.splitter.removeEventListener("pointermove", onMove),
                { once: true }
            )
        })

        el.splitter.addEventListener("keydown", (event) => {
            const step = { ArrowUp: -16, ArrowDown: 16, PageUp: -64, PageDown: 64 }[event.key]
            if (!step) return
            event.preventDefault()
            setQueryHeight(el.queryBar.getBoundingClientRect().height + step)
        })

        setQueryHeight(Number(localStorage.searchQueryHeight) || 140, false)

        /**
         * Theme: values only. `data-theme` is the palette in force, which the CSS
         * paints from; `data-pref` is what the reader asked for, and only it can
         * tell "dark because I chose it" from "dark because the OS is".
         */
        const THEME_ORDER = ["system", "light", "dark"]
        const systemTheme = matchMedia("(prefers-color-scheme: light)")

        const applyTheme = (pref) => {
            const root = document.documentElement
            root.dataset.pref = pref
            root.dataset.theme = pref === "system" ? (systemTheme.matches ? "light" : "dark") : pref
            localStorage.searchTheme = pref
            el.themeBtn.title = `Theme: ${pref}`
        }

        systemTheme.addEventListener("change", () => {
            if (document.documentElement.dataset.pref === "system") applyTheme("system")
        })

        // No `rtc`: this page loads its own copy of the sample people and asks
        // questions of it. Nothing here is about the transport.
        const db = await gdb("genosdb-search")

        for (const country of COUNTRIES) {
            const option = document.createElement("option")
            option.textContent = country
            el.country.append(option)
        }

        // ── The translation ─────────────────────────────────────────
        /**
         * The one function this example exists for.
         *
         * Each control contributes a clause only when it has a value — an empty
         * box must not become `{ name: "" }`, which would match nothing and look
         * like a broken database. The age pair is the interesting case: two
         * independent controls that produce three different shapes.
         */
        const buildQuery = () => {
            const query = {}

            const name = el.name.value.trim()
            // $regex rather than $eq: a search box that only matches the whole
            // name exactly is not a search box.
            if (name) query.name = { $regex: name }

            if (el.country.value) query.country = { $eq: el.country.value }
            if (el.gender.value) query.gender = { $eq: el.gender.value }

            const min = el.minAge.value === "" ? null : Number(el.minAge.value)
            const max = el.maxAge.value === "" ? null : Number(el.maxAge.value)
            if (min !== null && max !== null) query.age = { $between: [min, max] }
            else if (min !== null) query.age = { $gte: min }
            else if (max !== null) query.age = { $lte: max }

            // query, sorting and ceiling travel together in one options object.
            return {
                query,
                field: el.field.value,
                order: el.order.value,
                $limit: Number(el.limit.value) || 24
            }
        }

        /** Outlines whichever controls are currently contributing a clause. */
        const markActiveFields = () => {
            for (const control of [el.name, el.country, el.gender, el.minAge, el.maxAge]) {
                control.classList.toggle("active", control.value !== "")
            }
        }

        // ── Running ─────────────────────────────────────────────────
        const renderResults = (results) => {
            el.emptyView.classList.toggle("hidden", results.length > 0)
            el.emptyMessage.textContent = results.length ? "" : "Nobody matches these filters."

            el.results.replaceChildren(...results.map(({ value }) => {
                const person = document.createElement("article")
                person.className = "person"

                // The picture URL comes from a public API. It goes in as a
                // property, never as interpolated HTML: an <img src="${...}">
                // built by hand is the oldest injection there is.
                const photo = document.createElement("img")
                photo.src = value.picture
                photo.alt = ""
                photo.loading = "lazy"

                const text = document.createElement("div")
                text.className = "person-text"
                const name = document.createElement("b")
                name.textContent = value.name
                const meta = document.createElement("span")
                meta.textContent = `${value.age} · ${value.country}`
                text.append(name, meta)

                person.append(photo, text)
                return person
            }))
        }

        let searchTimer = null

        const search = async () => {
            const options = buildQuery()
            const clauses = Object.keys(options.query).length

            try {
                const started = performance.now()
                const { results } = await db.map(options)
                const elapsed = (performance.now() - started).toFixed(2)

                renderResults(results)
                el.results.parentElement.scrollTop = 0
                el.current.textContent = clauses
                    ? `${clauses} ${clauses === 1 ? "filter" : "filters"}`
                    : "No filters"

                setStatus(
                    results.length
                        ? `${results.length} of ${PEOPLE_COUNT} · ${elapsed} ms`
                        : `No match · ${elapsed} ms`,
                    results.length ? "ok" : ""
                )
            } catch (error) {
                setStatus(error.message, "error")
                console.error("Search error:", error)
            }
        }

        /**
         * The query is rewritten immediately and the search runs a beat later.
         *
         * Splitting the two is the point: the translation is what this page
         * teaches, so it must keep up with the keyboard, while the read can wait
         * until you stop typing.
         */
        const onFilterChange = () => {
            el.query.value = JSON.stringify(buildQuery(), null, 2)
            markActiveFields()
            clearTimeout(searchTimer)
            searchTimer = setTimeout(search, 250)
        }

        for (const control of [el.name, el.country, el.gender, el.minAge, el.maxAge, el.field, el.order, el.limit]) {
            control.addEventListener("input", onFilterChange)
        }

        // ── Data ────────────────────────────────────────────────────
        const loadPeople = async () => {
            setStatus("Fetching people…")
            el.reload.disabled = el.clear.disabled = true
            try {
                const response = await fetch(PEOPLE_URL)
                if (!response.ok) throw new Error(`${response.status} ${response.statusText}`)

                const { results } = await response.json()
                for (const person of results) {
                    await db.put({
                        name: `${person.name.first} ${person.name.last}`,
                        age: person.dob.age,
                        country: person.location.country,
                        gender: person.gender,
                        picture: person.picture.medium
                    })
                }
                setStatus(`${results.length} people loaded.`, "ok")
            } catch (error) {
                setStatus(`Could not load the sample people: ${error.message}`, "error")
                console.error("Load error:", error)
            } finally {
                el.reload.disabled = el.clear.disabled = false
            }
        }

        el.reload.addEventListener("click", async () => {
            const confirmed = await confirmAction({
                title: "Load 50 more people?",
                body: "The ones already here stay, so the set grows. Clear first for a fresh 50.",
                confirmLabel: "Load"
            })
            if (!confirmed) return
            await loadPeople()
            search()
        })

        el.clear.addEventListener("click", async () => {
            const confirmed = await confirmAction({
                title: "Clear everyone?",
                body: "Every record is removed. Reload writes a fresh set of 50.",
                confirmLabel: "Clear"
            })
            if (!confirmed) return
            await db.clear()
            renderResults([])
            el.emptyMessage.textContent = "No data. Reload people to search them."
            setStatus("Database cleared.")
        })

        applyTheme(localStorage.searchTheme ?? "system")
        el.themeBtn.addEventListener("click", () => {
            const next = (THEME_ORDER.indexOf(document.documentElement.dataset.pref) + 1) % THEME_ORDER.length
            applyTheme(THEME_ORDER[next])
        })

        // Fetch only into an empty database: a reload should not hit the API
        // again, and the button above is how you ask for that.
        const { results: existing } = await db.map({ $limit: 1 })
        if (!existing.length) await loadPeople()

        onFilterChange()
    </script>
</body>

</html>
