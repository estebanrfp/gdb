<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenosDB — Collaborative Whiteboard</title>

  <style>
    :root {
      /* Backgrounds (dark → elevated) */
      --bg-primary: #0d0f12;
      --bg-secondary: #14171c;
      --bg-tertiary: #1c2026;
      --bg-elevated: #22262d;

      /* Text */
      --text-primary: #e8eaed;
      --text-secondary: #9aa3ad;
      --text-tertiary: #5c6570;

      /* Accent & status */
      --accent: #4c8dff;
      --accent-hover: #6ba1ff;
      --ok: #34c77b;
      --warn: #f5a623;
      --danger: #ef5350;

      /* Borders */
      --border-subtle: #262b33;
      --border-strong: #333a44;

      /* Contrast pairs & elevation */
      --text-on-accent: #ffffff;
      --backdrop: rgba(0, 0, 0, .6);
      --shadow: 0 8px 24px rgba(0, 0, 0, .35);

      /* Shape & rhythm (8px grid) */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      /* Typography */
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    }

    /* The light palette redefines VALUES ONLY — not one component rule below
       changes with it. */
    [data-theme="light"] {
      --bg-primary: #f4f6fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f3f7;
      --bg-elevated: #ffffff;

      --text-primary: #1a1d24;
      --text-secondary: #6b7280;
      --text-tertiary: #9aa1ad;

      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok: #16a34a;
      --warn: #b45309;
      --danger: #dc2626;

      --border-subtle: #e4e7ee;
      --border-strong: #d4d9e3;

      --backdrop: rgba(26, 29, 36, .45);
      --shadow: 0 6px 24px rgba(26, 29, 36, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh; /* the mobile address bar is not part of the viewport */
      overflow: hidden;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .hidden { display: none !important; }

    /* ── Layout ─────────────────────────────────────────────── */
    /* The board is the product, so it gets the whole middle and the chrome
       goes to the edges in bands. The 280px sidebar this replaces spent a
       fifth of the drawing surface, permanently, on four buttons and a list
       that is usually one line long. */
    .layout {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      height: 100vh;
      height: 100dvh;
    }

    /* Every chrome band is 48px tall, so the three read as one system. */
    .topbar,
    .toolbar,
    .statusbar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 48px;
      padding: var(--space-2) var(--space-5);
      background: var(--bg-secondary);
    }

    .topbar { justify-content: space-between; border-bottom: 1px solid var(--border-subtle); }
    .toolbar { border-bottom: 1px solid var(--border-subtle); }
    .statusbar { justify-content: space-between; border-top: 1px solid var(--border-subtle); font-size: 12px; color: var(--text-tertiary); }

    .brand {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      letter-spacing: -.01em;
    }

    .brand span { font-weight: 400; color: var(--text-tertiary); }

    /* Pushes whatever follows to the far end of the band. */
    .spacer { flex: 1; }

    /* ── Buttons ────────────────────────────────────────────── */
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      /* A band's buttons are shorter than a page's: at default padding they
         are 37px tall, which with the band's own padding makes 54 and breaks
         the rhythm against the other two bands. */
      padding: 6px var(--space-3);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }

    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-hover); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    button.danger { background: transparent; border-color: var(--border-strong); color: var(--danger); }
    button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

    button.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
    button.ghost:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-strong); }

    button svg { width: 18px; height: 18px; fill: currentColor; }

    .icon-btn {
      padding: 6px;
      background: none;
      border: none;
      color: var(--text-secondary);
    }

    .icon-btn:hover:not(:disabled) { background: none; color: var(--text-primary); }
    .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; }

    /* One icon shows at a time, picked by the stored preference. */
    [data-pref="system"] .icon-sun, [data-pref="system"] .icon-moon,
    [data-pref="light"] .icon-system, [data-pref="light"] .icon-moon,
    [data-pref="dark"] .icon-system, [data-pref="dark"] .icon-sun { display: none; }

    /* ── The board ──────────────────────────────────────────── */
    /* Edge to edge, with no border and no radius: boxing a canvas wastes the
       space the drawing was going to occupy. */
    .board { position: relative; min-height: 0; background: var(--bg-primary); }

    canvas { display: block; cursor: crosshair; }
    canvas.grabbable { cursor: grab; }
    canvas.grabbing { cursor: grabbing; }

    /* The remote pointer inherits the peer's colour, so the arrow and the
       shapes that peer is dragging read as the same hand. */
    .remote-cursor {
      position: absolute;
      top: 0;
      left: 0;
      width: 18px;
      height: 18px;
      color: var(--accent);
      pointer-events: none;
      transition: transform .08s linear;
    }

    .remote-cursor svg { width: 100%; height: 100%; fill: currentColor; }

    /* ── Toasts ─────────────────────────────────────────────── */
    /* The stack itself is the popover, so it joins the top layer once and
       paints above a modal dialog's ::backdrop — which no z-index can beat. */
    .toast-stack {
      position: fixed;
      inset: auto;
      right: var(--space-5);
      bottom: var(--space-5);
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      overflow: visible;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 280px;
      max-width: 360px;
      padding: 14px 18px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--text-tertiary);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      animation: toast-in .3s ease;
      transition: opacity .4s, transform .4s;
    }

    .toast-icon { flex: 0 0 18px; text-align: center; font-size: 18px; line-height: 1; color: var(--text-tertiary); }
    .toast.success .toast-icon { color: var(--ok); }
    .toast.error   .toast-icon { color: var(--danger); }
    .toast.warning .toast-icon { color: var(--warn); }
    .toast-text { flex: 1; min-width: 0; }

    .toast.success { border-left-color: var(--ok); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warn); }

    /* The newest reads at full strength; every older one steps back equally. */
    .toast:not(:last-child) { opacity: .6; }
    .toast.out { opacity: 0; transform: translateX(20px); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ── Confirm dialog ─────────────────────────────────────── */
    /* Never window.confirm: it blocks the thread, so in a P2P app it freezes
       the very sync being demonstrated, rAF included. */
    #confirm-modal {
      width: min(440px, calc(100vw - var(--space-6)));
      padding: var(--space-6);
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      text-align: center;
    }

    #confirm-modal::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }
    #confirm-modal .modal-title { margin: 0 0 var(--space-3); font-size: 20px; font-weight: 700; }
    #confirm-modal .modal-hint { margin: 0 0 var(--space-5); font-size: 14px; color: var(--text-secondary); }
    #confirm-modal form { display: flex; flex-direction: column; gap: var(--space-2); }
    #confirm-modal button { width: 100%; padding: 13px var(--space-4); font-size: 14px; font-weight: 600; }
    #confirm-modal .danger { background: var(--danger); border-color: var(--danger); color: var(--text-on-accent); }
    #confirm-modal .danger:hover { background: var(--danger); border-color: var(--danger); color: var(--text-on-accent); filter: brightness(.93); }

    @media (prefers-reduced-motion: reduce) {
      .toast { animation: none; }
      .toast.out { transform: none; }
      .remote-cursor { transition: none; }
    }

    @media (max-width: 620px) {
      .topbar, .toolbar, .statusbar { padding-left: var(--space-4); padding-right: var(--space-4); }
      .brand span { display: none; }
    }
  </style>
</head>

<body>

  <div class="layout">
    <header class="topbar">
      <h1 class="brand">P2P Whiteboard <span>· shapes on a shared canvas</span></h1>
      <button id="theme-btn" class="icon-btn" title="Switch theme" aria-label="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-system" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <rect x="2" y="4" width="20" height="13" rx="2" />
          <path d="M9 21h6" />
        </svg>
      </button>
    </header>

    <div class="toolbar">
      <button id="add-circle" title="Add a circle" aria-label="Add a circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2z" />
        </svg>
      </button>
      <button id="add-square" title="Add a square" aria-label="Add a square">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 3v18h18V3H3zm16 16H5V5h14v14z" />
        </svg>
      </button>
      <button id="add-triangle" title="Add a triangle" aria-label="Add a triangle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M1 21h22L12 2 1 21z" />
        </svg>
      </button>

      <span class="spacer"></span>
      <button id="clear-all" class="danger">Clear</button>
    </div>

    <div class="board" id="board">
      <canvas id="whiteboard"></canvas>
    </div>

    <!-- What is true, never what you can do: the hint on the left, the network
         on the right — ambient, changing on its own, nobody acts on it. -->
    <footer class="statusbar">
      <span>Drag a shape to move it · double-click to delete it</span>
      <span id="presence">0 peers</span>
    </footer>
  </div>

  <dialog id="confirm-modal">
    <h2 class="modal-title">Clear the board?</h2>
    <p class="modal-hint">Every shape is removed for every peer, and there is no undo.</p>
    <form method="dialog">
      <button value="ok" class="danger">Clear board</button>
      <button value="cancel" class="ghost">Cancel</button>
    </form>
  </dialog>

  <div id="toasts" class="toast-stack" role="status" aria-live="polite" popover="manual"></div>

  <script type="module">
    /**
     * A whiteboard, and the two kinds of state a P2P app has.
     *
     * The shapes live in the graph: they are signed, replicated and still
     * there when everyone has left. The pointers and the in-flight drag do
     * not — they travel over ephemeral channels, because a cursor from a peer
     * who has gone is not worth keeping, and persisting one write per frame
     * would fill the log with positions nobody will read again.
     *
     * What to read here, and where:
     *   · db.map({ query }, cb)   — the shapes, live
     *   · db.room.channel(name)   — pointers and drags, ephemeral
     *   · db.put / db.remove      — a shape created, moved (on release) or deleted
     */
    import { gdb } from "../dist/index.js";

    const $ = (id) => document.getElementById(id);

    const canvas = $("whiteboard");
    const ctx = canvas.getContext("2d");
    const board = $("board");
    const presence = $("presence");
    const themeBtn = $("theme-btn");
    const toastsEl = $("toasts");
    const confirmModal = $("confirm-modal");

    const shapes = new Map();
    const peerData = new Map();
    let draggedShapeId = null;
    let dragOffsetX, dragOffsetY;

    // ── Feedback ────────────────────────────────────────────────
    const MAX_TOASTS = 3;
    const TOAST_ICONS = { info: "ⓘ", success: "✓", error: "✕", warning: "!" };

    const dropToast = (node) => {
      node.classList.add("out");
      setTimeout(() => {
        node.remove();
        if (!toastsEl.children.length && toastsEl.matches(":popover-open")) toastsEl.hidePopover();
      }, 400);
    };

    /** @param {string} message @param {'info'|'success'|'error'|'warning'} [kind='info'] */
    const toast = (message, kind = "info") => {
      const node = document.createElement("div");
      node.className = `toast ${kind}`;

      const icon = document.createElement("span");
      icon.className = "toast-icon";
      icon.textContent = TOAST_ICONS[kind] ?? TOAST_ICONS.info;

      const text = document.createElement("span");
      text.className = "toast-text";
      text.textContent = message;

      node.append(icon, text);
      node.onclick = () => dropToast(node);

      if (!toastsEl.matches(":popover-open")) toastsEl.showPopover();
      toastsEl.appendChild(node);
      while (toastsEl.children.length > MAX_TOASTS) dropToast(toastsEl.firstElementChild);
      setTimeout(() => node.isConnected && dropToast(node), 3000);
    };

    const confirmAction = () => new Promise((resolve) => {
      confirmModal.addEventListener("close", () => resolve(confirmModal.returnValue === "ok"), { once: true });
      confirmModal.showModal();
    });

    // ── Theme ───────────────────────────────────────────────────
    const systemTheme = matchMedia("(prefers-color-scheme: light)");

    const applyTheme = (pref) => {
      const root = document.documentElement;
      root.dataset.pref = pref;
      root.dataset.theme = pref === "system" ? (systemTheme.matches ? "light" : "dark") : pref;
      localStorage.whiteboardTheme = pref;
      themeBtn.title = `Theme: ${pref}`;
    };

    // On `system` the OS can change under us — follow it without a reload.
    systemTheme.addEventListener("change", () => {
      if (document.documentElement.dataset.pref === "system") applyTheme("system");
    });

    themeBtn.addEventListener("click", () => {
      const order = ["system", "light", "dark"];
      applyTheme(order[(order.indexOf(document.documentElement.dataset.pref) + 1) % order.length]);
    });

    applyTheme(localStorage.whiteboardTheme ?? "system");

    // ── Database ────────────────────────────────────────────────
    const db = await gdb("collab-board", { rtc: true });

    // Persistent state: every shape on the board, live. The callback fires for
    // each one on arrival and again on every change, whoever made it.
    const { unsubscribe } = await db.map({ query: { type: { $regex: "^shape" } } }, ({ id, value, action }) => {
      action === "removed" ? shapes.delete(id) : shapes.set(id, { id, ...value });
      render();
    });

    // Leave on real unload only — pagehide also fires on tab-freeze.
    addEventListener("beforeunload", () => { unsubscribe(); db.room?.leave?.(); });

    // ── Ephemeral state: pointers and the drag in flight ────────
    const cursorChannel = db.room.channel("cursor-pos");
    const dragChannel = db.room.channel("shape-drag");

    /** Same peer, same colour everywhere: the hue comes from the peer id. */
    const hueOf = (id) => [...String(id)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

    const updatePresence = () => {
      const count = peerData.size;
      presence.textContent = `${count} ${count === 1 ? "peer" : "peers"}`;
    };

    db.room.on("peer:join", (peerId) => {
      const cursorEl = document.createElement("div");
      cursorEl.className = "remote-cursor";
      cursorEl.style.color = `hsl(${hueOf(peerId)} 75% 65%)`;
      cursorEl.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>';
      board.appendChild(cursorEl);
      peerData.set(peerId, { cursorEl });
      updatePresence();
    });

    db.room.on("peer:leave", (peerId) => {
      peerData.get(peerId)?.cursorEl.remove();
      peerData.delete(peerId);
      updatePresence();
    });

    /**
     * Pointer positions travel in CANVAS coordinates, not window ones.
     *
     * They used to be sent as `clientX/clientY` and then applied as `left`/`top`
     * inside the board, which is offset from the window by whatever chrome sits
     * around it — so every remote pointer was drawn displaced by the width of
     * the sidebar. Canvas coordinates are also what the shapes use, so a
     * pointer now lands on the shape it is actually over.
     */
    cursorChannel.on("message", (position, peerId) => {
      const peer = peerData.get(peerId);
      if (!peer) return;
      peer.cursorEl.style.transform = `translate(${position.x}px, ${position.y}px)`;
    });

    // One send per frame, coalesced to the latest position: mousemove fires
    // faster than the display refreshes, and every send serializes and writes
    // to each peer's data channel.
    let queuedPointer = null;
    const flushPointer = () => {
      cursorChannel.send(queuedPointer);
      queuedPointer = null;
    };

    canvas.addEventListener("mousemove", (e) => {
      const { left, top } = canvas.getBoundingClientRect();
      if (!queuedPointer) requestAnimationFrame(flushPointer);
      queuedPointer = { x: e.clientX - left, y: e.clientY - top };
    });

    dragChannel.on("message", (data) => {
      if (data.id === draggedShapeId) return; // never apply our own drag back
      const shape = shapes.get(data.id);
      if (!shape) return;
      shape.x = data.x;
      shape.y = data.y;
      render();
    });

    // ── Render ──────────────────────────────────────────────────
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      shapes.forEach((shape) => {
        ctx.fillStyle = shape.color;
        if (shape.type === "shape/circle") {
          ctx.beginPath();
          ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
          ctx.fill();
        } else if (shape.type === "shape/square") {
          ctx.fillRect(shape.x - shape.size / 2, shape.y - shape.size / 2, shape.size, shape.size);
        } else if (shape.type === "shape/triangle") {
          const h = shape.size * (Math.sqrt(3) / 2);
          ctx.beginPath();
          ctx.moveTo(shape.x, shape.y - h / 2);
          ctx.lineTo(shape.x - shape.size / 2, shape.y + h / 2);
          ctx.lineTo(shape.x + shape.size / 2, shape.y + h / 2);
          ctx.closePath();
          ctx.fill();
        }
      });
    }

    const getRandomColor = () => `hsl(${Math.random() * 360}, 90%, 70%)`;

    const createShape = (type, props) => db.put({
      type: `shape/${type}`,
      x: Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1),
      y: Math.random() * (canvas.height * 0.8) + (canvas.height * 0.1),
      color: getRandomColor(),
      ...props
    });

    $("add-circle").onclick = () => createShape("circle", { radius: 35 });
    $("add-square").onclick = () => createShape("square", { size: 60 });
    $("add-triangle").onclick = () => createShape("triangle", { size: 70 });

    $("clear-all").onclick = async () => {
      if (!shapes.size) return toast("The board is already empty", "warning");
      if (!await confirmAction()) return;
      await db.clear();
      toast("Board cleared", "success");
    };

    // ── Drag & drop: local first, ephemeral to peers, one write on release ──
    function throttle(func, limit) {
      let inThrottle;
      return function (...args) {
        if (inThrottle) return;
        func.apply(this, args);
        inThrottle = true;
        setTimeout(() => (inThrottle = false), limit);
      };
    }

    const throttledDragSend = throttle((data) => dragChannel.send(data), 30);

    function getShapeAt(x, y) {
      // Reversed: the last drawn shape is the one on top, so it is hit first.
      return [...shapes.values()].reverse().find((shape) => {
        if (shape.type === "shape/circle") {
          return Math.sqrt((x - shape.x) ** 2 + (y - shape.y) ** 2) < shape.radius;
        } else if (shape.type === "shape/square") {
          return Math.abs(x - shape.x) < shape.size / 2 && Math.abs(y - shape.y) < shape.size / 2;
        } else if (shape.type === "shape/triangle") {
          const h = shape.size * (Math.sqrt(3) / 2);
          const p0 = { x: shape.x, y: shape.y - h / 2 };
          const p1 = { x: shape.x - shape.size / 2, y: shape.y + h / 2 };
          const p2 = { x: shape.x + shape.size / 2, y: shape.y + h / 2 };
          const A = 1 / 2 * (-p1.y * p2.x + p0.y * (-p1.x + p2.x) + p0.x * (p1.y - p2.y) + p1.x * p2.y);
          const sign = A < 0 ? -1 : 1;
          const s = (p0.y * p2.x - p0.x * p2.y + (p2.y - p0.y) * x + (p0.x - p2.x) * y) * sign;
          const t = (p0.x * p1.y - p0.y * p1.x + (p0.y - p1.y) * x + (p1.x - p0.x) * y) * sign;
          return s > 0 && t > 0 && (s + t) < 2 * A * sign;
        }
      });
    }

    const pointOn = (e) => {
      const { left, top } = canvas.getBoundingClientRect();
      return { x: e.clientX - left, y: e.clientY - top };
    };

    canvas.addEventListener("mousedown", (e) => {
      const { x, y } = pointOn(e);
      const shape = getShapeAt(x, y);
      if (!shape) return;
      draggedShapeId = shape.id;
      dragOffsetX = x - shape.x;
      dragOffsetY = y - shape.y;
      canvas.classList.add("grabbing");
    });

    canvas.addEventListener("mousemove", (e) => {
      const { x, y } = pointOn(e);

      if (!draggedShapeId) {
        canvas.classList.toggle("grabbable", !!getShapeAt(x, y));
        return;
      }

      const shape = shapes.get(draggedShapeId);
      if (!shape) return;

      // Paint locally first so the drag never waits on the network, tell the
      // peers over the ephemeral channel, and persist only on release.
      shape.x = x - dragOffsetX;
      shape.y = y - dragOffsetY;
      render();
      throttledDragSend({ id: draggedShapeId, x: shape.x, y: shape.y });
    });

    const endDrag = () => {
      if (draggedShapeId) {
        const finalShape = shapes.get(draggedShapeId);
        if (finalShape) {
          const { id, ...value } = finalShape;
          db.put(value, id); // one signed write per gesture, not per frame
        }
      }
      draggedShapeId = null;
      canvas.classList.remove("grabbing");
    };

    canvas.addEventListener("mouseup", endDrag);
    canvas.addEventListener("mouseleave", endDrag);

    canvas.addEventListener("dblclick", (e) => {
      const { x, y } = pointOn(e);
      const shape = getShapeAt(x, y);
      if (shape) db.remove(shape.id);
    });

    // ── Boot ────────────────────────────────────────────────────
    // The canvas has a pixel size as well as a CSS one, and only the box
    // changes on its own — so it is measured rather than assumed, and a
    // ResizeObserver catches the bands changing height too, which a window
    // `resize` listener would miss.
    const resizeCanvas = () => {
      canvas.width = board.clientWidth;
      canvas.height = board.clientHeight;
      render();
    };

    new ResizeObserver(resizeCanvas).observe(board);
    resizeCanvas();
    updatePresence();
  </script>
</body>

</html>
