<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenosDB Collab Doc</title>
  <style>
    /* Design tokens (docs/genosdb-design-guide.md §2). Every colour in this
       file now comes from here — the only literals left are the six of the
       code syntax theme, which is a palette of its own. */
    :root {
      --bg-primary: #0d0f12;
      --bg-secondary: #14171c;
      --bg-tertiary: #1c2026;
      --bg-elevated: #22262d;

      --text-primary: #e8eaed;
      --text-secondary: #9aa3ad;
      --text-tertiary: #5c6570;

      --accent: #4c8dff;
      --accent-hover: #6ba1ff;
      --ok: #34c77b;
      --warn: #f5a623;
      --danger: #ef5350;
      --violet: #a78bfa;

      --border-subtle: #262b33;
      --border-strong: #333a44;

      --text-on-accent: #ffffff;
      --backdrop: rgba(0, 0, 0, .6);
      --shadow: 0 8px 24px rgba(0, 0, 0, .35);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    }

    /* The light palette redefines VALUES ONLY — not one component rule below
       changes with it. If a theme toggle forced you to touch a component, the
       token system would be broken. */
    [data-theme="light"] {
      --bg-primary: #f4f6fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f3f7;
      --bg-elevated: #ffffff;

      --text-primary: #1a1d24;
      --text-secondary: #6b7280;
      --text-tertiary: #9aa1ad;

      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok: #16a34a;
      --warn: #b45309;
      --danger: #dc2626;
      --violet: #7c3aed;

      --border-subtle: #e4e7ee;
      --border-strong: #d4d9e3;

      --backdrop: rgba(26, 29, 36, .45);
      --shadow: 0 6px 24px rgba(26, 29, 36, .07);
    }

    /* Code colours are a syntax theme rather than chrome, and they are tuned
       for a dark ground — so the light palette restates them instead of
       inheriting six values that would read as glare on white. */
    [data-theme="light"] .hl-kw { color: #0000ff; }
    [data-theme="light"] .hl-str { color: #a31515; }
    [data-theme="light"] .hl-num { color: #098658; }
    [data-theme="light"] .hl-text { color: var(--text-primary); }
    [data-theme="light"] .hl-comment { color: #008000; }
    [data-theme="light"] .hl-punct { color: var(--text-secondary); }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* the mobile address bar is not part of the viewport */
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* ── Top bar ────────────────────────────────────────────────
       The app and the session, nothing else: brand left, session right.
       48px, the height every chrome band in a GenosDB app shares. */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-height: 48px;
      padding: var(--space-2) var(--space-5);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      letter-spacing: -.01em;
      color: var(--text-primary);
    }

    .brand span { font-weight: 400; color: var(--text-tertiary); }

    .session { display: flex; align-items: center; gap: var(--space-3); flex: 0 0 auto; }

    /* Abbreviated address first, role second — the canonical session format. */
    .session-addr {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-secondary);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .session-addr:hover:not(:disabled) { color: var(--text-primary); }
    .session-addr:empty { display: none; }

    /* Tier colour on the text, never a filled pill: the session area is
       chrome, not content. */
    .role-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--tier, var(--text-tertiary));
    }

    .role-badge:empty { display: none; }
    .role-badge[data-role="guest"]      { --tier: var(--text-tertiary); }
    .role-badge[data-role="editor"]     { --tier: var(--ok); }
    .role-badge[data-role="admin"]      { --tier: var(--warn); }
    .role-badge[data-role="superadmin"] { --tier: var(--violet); }

    .topbar .icon-btn {
      display: flex;
      padding: 6px;
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .topbar .icon-btn:hover:not(:disabled) { background: none; color: var(--text-primary); }
    .topbar .icon-btn svg { width: 17px; height: 17px; }

    /* One icon shows at a time, picked by the stored preference. */
    [data-pref="system"] .icon-sun, [data-pref="system"] .icon-moon,
    [data-pref="light"] .icon-system, [data-pref="light"] .icon-moon,
    [data-pref="dark"] .icon-system, [data-pref="dark"] .icon-sun { display: none; }

    /* ── Status bar ─────────────────────────────────────────────
       What is true, never what you can do: the open document's standing on
       the left, the network on the right. */
    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-height: 48px;
      padding: var(--space-2) var(--space-5);
      font-size: 12px;
      color: var(--text-tertiary);
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-subtle);
    }

    .status-left { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }

    /* Signed out, the hint is the way back to the door — re-entry is
       contextual, never a standing Sign-in button in the chrome. */
    .statusbar .reopen { text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .statusbar .reopen:hover { color: var(--text-secondary); }

    #statusSaved { color: var(--ok); }

    #toolbar {
      background-color: var(--bg-secondary);
      padding: 0.5rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      overflow-x: auto;
    }

    #toolbar button {
      background: var(--accent);
      border: none;
      color: var(--text-on-accent);
      padding: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }

    #toolbar button:hover {
      background: var(--accent-hover);
    }

    #toolbar select,
    #toolbar input[type="color"] {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 0.35rem 0.4rem;
      height: 30px;
    }

    #toolbar .icon-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 0;
    }

    #toolbar .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      display: block;
    }

    #toolbar .icon-btn .fallback {
      display: none;
      font-size: 14px;
      line-height: 1;
    }

    #toolbar .icon-btn strong,
    #toolbar .icon-btn em,
    #toolbar .icon-btn u,
    #toolbar .icon-btn span {
      font-size: 14px;
      line-height: 1;
      display: block;
    }

    #toolbar .divider {
      width: 1px;
      height: 24px;
      background: var(--bg-tertiary);
      margin: 0 6px;
      align-self: center;
    }

    #toolbar .spacer {
      flex: 1;
    }

    /* Orange accent for the last two toolbar buttons */
    #toolbar #togglePreview,
    #toolbar #resetSplit {
      background: var(--warn);
      /* amber-500 */
      color: var(--text-on-accent);
    }

    #toolbar #togglePreview:hover,
    #toolbar #resetSplit:hover {
      background: var(--warn);
      /* amber-600 */
    }

    #toolbar #togglePreview[aria-pressed="true"] {
      background: var(--warn);
      /* amber-700 */
    }

    /* Green accent for file and video buttons */
    #toolbar #btnFile,
    #toolbar #startVideo {
      background: var(--ok);
      /* green-500 */
      color: var(--text-on-accent);
    }

    #toolbar #btnFile:hover,
    #toolbar #startVideo:hover {
      background: var(--ok);
      /* green-600 */
    }

    /* Blue accent for save version button */
    #toolbar #saveVersion {
      background: var(--accent);
      /* blue-500 */
      color: var(--text-on-accent);
    }

    #toolbar #saveVersion:hover {
      background: var(--accent-hover);
      /* blue-600 */
    }

    #editorWrap {
      flex: 1;
      display: flex;
      overflow: hidden;
      width: 100%;
    }

    /* Left vertical toolbar */
    #sideToolbar {
      width: 44px;
      background: var(--bg-primary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 6px 4px;
      box-sizing: border-box;
    }

    #sideToolbar .icon-btn,
    #sideToolbar button {
      width: 30px;
      height: 30px;
      background: var(--accent);
      color: var(--text-on-accent);
      border: none;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }

    #sideToolbar .icon-btn:hover,
    #sideToolbar button:hover,
    #sideToolbar .color-btn:hover {
      background: var(--accent-hover);
    }

    #sideToolbar .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      display: block;
    }

    #sideToolbar .icon-btn .fallback {
      display: none;
      font-size: 14px;
      line-height: 1;
    }

    #sideToolbar .color-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      position: relative;
    }

    #sideToolbar .color-btn input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    #sideToolbar .icon-btn strong,
    #sideToolbar .icon-btn em,
    #sideToolbar .icon-btn u,
    #sideToolbar .icon-btn span {
      font-size: 14px;
      line-height: 1;
      display: block;
    }

    #sideToolbar .color-btn input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    #sideToolbar .color-btn input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--border-strong);
      border-radius: 4px;
    }

    /* numeric gutter removed */
    #editor {
      flex: 1;
      width: 100%;
      padding: 1rem;
      background-color: var(--bg-primary);
      border: none;
      color: var(--text-primary);
      font-size: 1rem;
      line-height: 1.5;
      outline: none;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      position: relative;
      /* needed for absolute overlay positioning */
    }

    /* Left editor pane header (mirrors preview header style) */
    #editorPane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #editorHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.85rem;
      min-height: 42px;
    }

    #editorHeader .spacer {
      flex: 1;
    }

    #editorHeader .metric {
      color: var(--text-primary);
    }

    /* Right-side preview */
    #preview {
      width: 50%;
      max-width: none;
      /* allow JS to set px widths */
      min-width: 280px;
      border-left: 1px solid var(--border-subtle);
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
    }

    /* Draggable vertical splitter */
    #splitter {
      width: 6px;
      cursor: col-resize;
      background: var(--bg-tertiary);
      flex: 0 0 6px;
    }

    #splitter:hover,
    #splitter.dragging {
      background: var(--bg-tertiary);
    }

    #previewHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.85rem;
      min-height: 42px;
    }

    #previewHeader select {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 0.25rem 0.35rem;
      height: 30px;
    }

    #previewContent {
      flex: 1;
      overflow: auto;
      padding: 1rem;
      white-space: pre-wrap;
      /* for Markdown text */
    }

    /* HTML source mode: monospace + syntax token colors (VS Code dark palette) */
    #previewContent.html-mode {
      font-family: 'Consolas', 'SF Mono', ui-monospace, monospace;
      font-size: 0.85rem;
      line-height: 1.55;
    }

    .hl-punct { color: #808080; }
    .hl-tag { color: #569cd6; }
    .hl-attr { color: #9cdcfe; }
    .hl-str { color: #ce9178; }
    .hl-text { color: #d4d4d4; }
    .hl-comment { color: #6a9955; font-style: italic; }

    /* Placeholder for contenteditable */
    #editor:empty:before {
      content: attr(data-placeholder);
      color: var(--text-tertiary);
    }


    /* Buttons of the middle toolbar (unchanged in this pass). */
    #fileInput,
    #saveVersion,
    #startVideo {
      background: var(--accent);
      border: none;
      color: var(--text-on-accent);
      padding: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }

    #fileInput:hover,
    #saveVersion:hover,
    #startVideo:hover {
      background: var(--accent-hover);
    }

    /* ── Identity door ──────────────────────────────────────────
       The canonical implementation (§4.1), copied from docs.html rather than
       redesigned: one field that both accepts and shows a phrase, full-width
       actions stacked, and everything that needs a paragraph at the foot. The
       three-phase state machine it replaces tracked in markup what the SM
       already publishes in its state. */
    #identityModal {
      width: min(440px, calc(100vw - var(--space-6)));
      padding: var(--space-6);
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      text-align: center;
    }

    #identityModal::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }

    #identityModal .modal-title { margin: 0 0 var(--space-3); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
    #identityModal .modal-hint { margin: 0 0 var(--space-5); font-size: 14px; color: var(--text-secondary); }

    .mnemonic-field { position: relative; }

    /* Grows with the phrase: compact while empty, and a 24-word phrase is
       fully visible — you must be able to check a recovery phrase without
       scrolling it. */
    #mnemonic-input {
      min-height: 45px;   /* the exact height of an action button */
      display: block;     /* an inline-block textarea leaves 6px of descender below it */
      width: 100%;
      padding: var(--space-2) var(--space-3);
      padding-right: 32px; /* the copy icon never sits on the last word */
      overflow: hidden;
      box-sizing: border-box;
      font-family: var(--mono);
      font-size: 13px;
      text-align: left;
      color: var(--text-primary);
      background: none;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      outline: none;
      resize: none;
    }

    /* Keeps its ordinary grey border on focus: the dialog focuses it on open,
       and an accent ring would spotlight the one element that should stay
       quiet. In a text field the caret already says where you are. */
    #mnemonic-input:focus { border-color: var(--border-strong); }
    #mnemonic-input::placeholder { color: var(--text-tertiary); }
    #mnemonic-input[readonly] { color: var(--text-tertiary); background: var(--bg-primary); }

    .field-action {
      position: absolute;
      right: 6px;
      bottom: 6px;
      display: flex;
      padding: 5px;
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
    }

    .field-action svg { width: 15px; height: 15px; }
    .field-action:hover:not(:disabled) { background: none; color: var(--text-primary); }

    /* The gap above matches the gap between the buttons: the field is the
       first step of the same stack, not a separate block. */
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .modal-actions button {
      width: 100%;
      padding: 13px var(--space-4);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
    }

    .modal-actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-hover); }

    .modal-actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
    .modal-actions button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--text-on-accent); }

    .modal-actions button.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
    .modal-actions button.ghost:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-strong); }

    /* Sized like a button, taking over the slot the demo shortcut vacates when
       a phrase is generated, so the modal keeps its height across phases
       instead of jumping under the cursor. */
    .modal-warn {
      display: grid;
      place-items: center;
      min-height: 45px;
      margin: var(--space-2) 0 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--warn);
    }

    /* ── Toasts ─────────────────────────────────────────────────
       The canonical component (§6). The stack itself is the popover, so it
       joins the top layer once and paints above a modal dialog's ::backdrop —
       which no z-index can beat. */
    .toast-stack {
      position: fixed;
      inset: auto;
      right: var(--space-5);
      bottom: var(--space-5);
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      overflow: visible;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 280px;
      max-width: 360px;
      padding: 14px 18px;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--text-tertiary);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      animation: toast-in .3s ease;
      transition: opacity .4s, transform .4s;
    }

    .toast-icon { flex: 0 0 18px; text-align: center; font-size: 18px; line-height: 1; color: var(--text-tertiary); }
    .toast.success .toast-icon { color: var(--ok); }
    .toast.error   .toast-icon { color: var(--danger); }
    .toast.warning .toast-icon { color: var(--warn); }
    .toast-text { flex: 1; min-width: 0; }

    .toast.success { border-left-color: var(--ok); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warn); }

    /* The newest reads at full strength; every older one steps back equally. */
    .toast:not(:last-child) { opacity: .6; }
    .toast.out { opacity: 0; transform: translateX(20px); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast { animation: none; }
      .toast.out { transform: none; }
    }

    /* Role-gated tools: guests see the editing UI disabled, not hidden */
    #toolbar button:disabled,
    #sideToolbar button:disabled,
    #toolbar select:disabled,
    #sideToolbar input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Version rows: restore button + admin-only delete */
    .version-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .version-row .version-del {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      padding: 0 0.2rem;
      font-size: 0.85rem;
    }

    /* ── Video strip ────────────────────────────────────────────
       Cameras float over a corner instead of taking a column: the document is
       what the app is for, and giving video its own band would narrow the
       text for something that is empty most of the time. It clears the status
       bar (48px) rather than sitting on top of it, and disappears entirely
       when nobody is on camera. */
    #videoContainer {
      position: fixed;
      right: var(--space-5);
      bottom: calc(48px + var(--space-4));
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--space-2);
      max-width: min(420px, calc(100vw - var(--space-6)));
      z-index: 1100;
    }

    #videoContainer:empty { display: none; }

    .video-tile { position: relative; }

    .video-tile video {
      display: block;
      width: 150px;
      background: var(--bg-primary);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
    }

    /* Who you are looking at, over the picture rather than beside it — the
       tile is small enough that a caption underneath would double its height. */
    .video-tile .tag {
      position: absolute;
      left: 6px;
      bottom: 6px;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: var(--backdrop);
      color: #fff;
      font-family: var(--mono);
      font-size: 10px;
      pointer-events: none;
    }

    /* Your own camera is mirrored, the way every video app shows it: raising
       your left hand should raise the hand on the left of the picture. */
    .video-tile.is-self video { transform: scaleX(-1); }

    /* Rows read as text, not as controls: one per line, separated by space
       alone, with the destructive action revealed on hover like any row
       action. */
    #historyModal .version-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    #historyModal .version-row button,
    #historyModal a.file-item {
      display: block;
      flex: 1;
      min-width: 0;
      padding: 6px 0;
      font: inherit;
      font-size: 13px;
      text-align: left;
      text-decoration: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #historyModal .version-row button:hover,
    #historyModal a.file-item:hover { color: var(--accent); }

    #historyModal .version-row .version-del {
      flex: 0 0 auto;
      padding: 0 4px;
      font-size: 15px;
      color: var(--text-tertiary);
      opacity: 0;
      transition: opacity .15s, color .15s;
    }

    #historyModal .version-row:hover .version-del,
    #historyModal .version-del:focus-visible { opacity: 1; }
    #historyModal .version-del:hover { color: var(--danger); }

    /* ── History dialog ─────────────────────────────────────────
       Wider than the identity door and left-aligned, because it carries real
       content rather than a short focused flow. */
    #historyModal {
      width: min(520px, calc(100vw - var(--space-6)));
      padding: var(--space-6);
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      text-align: left;
    }

    #historyModal::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }
    #historyModal .modal-title { margin: 0 0 var(--space-5); font-size: 20px; font-weight: 700; }

    /* A rule under the label, and the list itself stays bare: what separates
       is a 1px line and the space around it, never a card. */
    .history-section h3 {
      margin: 0 0 var(--space-3);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .history-section { margin-bottom: var(--space-5); }
    .history-section > div { max-height: 180px; overflow-y: auto; }

    /* Says what will appear there, so an empty list reads as waiting rather
       than as something that failed to load. */
    .history-empty { margin: 0; font-size: 13px; color: var(--text-tertiary); }
    .history-section > div:not(:empty) + .history-empty { display: none; }

    .cursor {
      position: absolute;
      width: 2px;
      height: 1.5rem;
      background-color: var(--accent);
      opacity: 0.8;
      pointer-events: none;
      z-index: 2;
    }

    .selection-rect {
      position: absolute;
      background-color: color-mix(in srgb, var(--accent) 25%, transparent);
      /* default; overridden per-peer */
      border-radius: 2px;
      pointer-events: none;
      z-index: 1;
    }

    @media (max-width: 600px) {
      #editor {
        font-size: 0.9rem;
      }

      #status,
      #auth {
        font-size: 0.75rem;
      }
    }
  </style>
</head>

<body>

  <!-- History and shared files. A dialog rather than a panel that unfolds
       inside the view: anything opening in the content column shifts the text
       the reader is in the middle of. It also lets the two lists be two

  <dialog id="historyModal">

  <!-- The identity door (§4.1). Four blocks, in this order; anything that
       needs a paragraph goes to the foot, under the fold of attention. -->
  <dialog id="identityModal">
    <h2 class="modal-title">Collab Doc</h2>
    <p class="modal-hint">Collaborative editing on a serverless P2P graph.</p>

    <div class="mnemonic-field">
      <textarea id="mnemonic-input"
        placeholder="Enter your 12-word mnemonic phrase to log in or recover…"></textarea>
      <button id="mnemonic-clip" class="field-action hidden" title="Copy phrase" aria-label="Copy phrase">
