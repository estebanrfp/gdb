        </svg>
      </button>
    </div>

    <div class="modal-actions">
      <button id="generate-btn" class="primary">Generate new identity</button>
      <button id="login-btn" class="primary">Login with mnemonic</button>
      <button id="passkey-protect-btn" class="primary hidden">Protect with passkey</button>
      <button id="passkey-login-btn" class="hidden">Login with passkey</button>
      <button id="demo-login-btn" class="ghost">🛡️ Superadmin (demo)</button>
    </div>

    <p id="phrase-warning" class="modal-warn hidden">Save this phrase. There is no reset.</p>

    <!-- Guidance for whoever reads this file, deliberately not on screen:
         the demo superadmin runs the governance engine in this browser, which
         is what promotes a signed-in guest to `editor` a few seconds later.
         Without one online, nobody is promoted — governance.html shows why. -->
  </dialog>

  <div id="toasts" class="toast-stack" role="status" aria-live="polite" popover="manual"></div>

  <div id="videoContainer"></div>

  <script type="module">
    import { gdb } from "../dist/index.js";

    // Demo superadmin — SHOWCASE ONLY. Its mnemonic is public so any visitor can
    // run the governance engine. Replace both for a real deployment.
    const DEMO_SUPERADMIN = {
      address: "0xbfDe0eCEC5332Fd86D2570085571D6051Df098dA",
      mnemonic: "panic now afford carbon donate lecture drift excite collect essay stuff prosper"
    };

    // Zero-trust RBAC: the document is communal, but WRITING it must be earned.
    // Guests read and watch live edits; editors write; admins moderate versions.
    const ROLES = {
      superadmin: { can: ["assignRole"], inherits: ["admin"] }, // signs promotions
      admin: { can: ["delete", "deleteAny"], inherits: ["editor"] }, // cleans up versions
      editor: { can: ["write", "link", "sync"], inherits: ["guest"] }, // edits & saves versions
      guest: { can: ["read", "sync"] } // watches the live document only
    };

    // Public advancement rules (last-match-wins, low demo thresholds). The engine
    // runs while a superadmin is online and signs every promotion.
    const MEMBER = { $in: ["editor", "admin"] };
    const GOVERNANCE_RULES = [
      { if: { role: "guest" }, offsetTimestamp: 10000, then: { assignRole: "editor" } }, // onboarding gate
      { if: { role: MEMBER }, then: { assignRole: "editor" } }, // floor
      { if: { role: MEMBER, versionsSaved: { $gte: 3 } }, then: { assignRole: "admin" } } // climb
    ];

    const SUPER_ADMINS = [DEMO_SUPERADMIN.address];

    // Initialize GenosDB with P2P, Security Module and Governance
    const db = await gdb("collab", {
      rtc: true,
      sm: {
        superAdmins: SUPER_ADMINS,
        customRoles: ROLES,
        governanceRules: GOVERNANCE_RULES
      }
    });
    globalThis.db = db; // console handle (matches the official examples)
    const room = db.room;
    const docChannel = room.channel("docUpdates");
    const cursorChannel = room.channel("cursorPos");
    const fileChannel = room.channel("fileTransfer");
    const editor = document.getElementById('editor');
    const wordCountEl = document.getElementById('wordCount');
    const previewModeSel = document.getElementById('previewMode');
    const previewContent = document.getElementById('previewContent');
    const editorPane = document.getElementById('editorPane');
    const previewPane = document.getElementById('preview');
    const splitter = document.getElementById('splitter');
    const editorWrap = document.getElementById('editorWrap');
    const togglePreviewBtn = document.getElementById('togglePreview');
    const toggleVersionsBtn = document.getElementById('toggleVersions');
    const resetSplitBtn = document.getElementById('resetSplit');
    // Session chrome (top bar) and the identity door.
    const sessionAddrBtn = document.getElementById('session-addr');
    const roleBadge = document.getElementById('role-badge');
    const logoutBtn = document.getElementById('logout-btn');
    const identityModal = document.getElementById('identityModal');
    const mnemonicBox = document.getElementById('mnemonic-input');
    const mnemonicClip = document.getElementById('mnemonic-clip');
    const generateBtn = document.getElementById('generate-btn');
    const loginBtn = document.getElementById('login-btn');
    const passkeyProtectBtn = document.getElementById('passkey-protect-btn');
    const passkeyLoginBtn = document.getElementById('passkey-login-btn');
    const demoLoginBtn = document.getElementById('demo-login-btn');
    const phraseWarning = document.getElementById('phrase-warning');
    const toastsEl = document.getElementById('toasts');
    const themeBtn = document.getElementById('theme-btn');

    // ── Theme: three states (system / light / dark) ──────────────────────
    const systemTheme = matchMedia('(prefers-color-scheme: light)');

    const applyTheme = (pref) => {
      const root = document.documentElement;
      root.dataset.pref = pref;
      root.dataset.theme = pref === 'system' ? (systemTheme.matches ? 'light' : 'dark') : pref;
      localStorage.collabTheme = pref;
      themeBtn.title = `Theme: ${pref}`;
    };

    // On `system` the OS can change under us — follow it without a reload.
    systemTheme.addEventListener('change', () => {
      if (document.documentElement.dataset.pref === 'system') applyTheme('system');
    });

    themeBtn.addEventListener('click', () => {
      const order = ['system', 'light', 'dark'];
      applyTheme(order[(order.indexOf(document.documentElement.dataset.pref) + 1) % order.length]);
    });

    applyTheme(localStorage.collabTheme ?? 'system');
    const fileInput = document.getElementById('fileInput');
    const saveVersionBtn = document.getElementById('saveVersion');
    const startVideoBtn = document.getElementById('startVideo');
    const btnFile = document.getElementById('btnFile');
    const btnBold = document.getElementById('btnBold');
    const btnItalic = document.getElementById('btnItalic');
    const btnUnderline = document.getElementById('btnUnderline');
    const btnStrike = document.getElementById('btnStrike');
    const colorPicker = document.getElementById('colorPicker');
    const btnLink = document.getElementById('btnLink');
    const btnUnlink = document.getElementById('btnUnlink');
    const blockFormat = document.getElementById('blockFormat');
    const btnUl = document.getElementById('btnUl');
    const btnOl = document.getElementById('btnOl');
    const btnLeft = document.getElementById('btnLeft');
    const btnCenter = document.getElementById('btnCenter');
    const btnRight = document.getElementById('btnRight');
    const btnUndo = document.getElementById('btnUndo');
    const btnRedo = document.getElementById('btnRedo');
    const btnClear = document.getElementById('btnClear');
    const historyModal = document.getElementById('historyModal');
    const versionRowsHost = document.getElementById('versionRows');
    const fileRowsHost = document.getElementById('fileRows');
    const statusPeers = document.getElementById('statusPeers');
    const statusRole = document.getElementById('statusRole');
    const statusSaved = document.getElementById('statusSaved');
    const videoContainer = document.getElementById('videoContainer');
    const docId = 'main-doc';
    let peerCount = 0;
    let isSaving = false;
    let lastTimestamp = 0;
    // Live typing throttle + save debounce
    let liveThrottleMs = 80; // ~12.5 fps for real-time feel
    let lastLiveSent = 0;
    let liveScheduled = null;
    let pendingContent = '';
    let saveDebounceTimer;
    let showSavedUntil = 0;
    let savedFlashTimer = null;
    // Live identity state (fed by the SM callback + the reactive role watcher)
    let myAddress = null;
    let myRole = null;
    let renderVersions = () => { }; // bound once the version store exists (below)
    const cursorMap = {};
    const peerVideos = {};

    // File button triggers hidden input
    btnFile.addEventListener('click', () => fileInput.click());

    // Helper: shorten Ethereum address for UI
    const shortAddr = (addr) => {
      if (!addr || typeof addr !== 'string') return addr || '';
      const a = addr.trim();
      return a.length > 12 ? `${a.slice(0, 6)}…${a.slice(-4)}` : a;
    };

    // ── XSS guard ────────────────────────────────────────────────────────────
    // The document body travels P2P (docChannel) and persists in the graph, so any
    // peer can craft its markup. Every write into the editor flows through this
    // allowlist sanitizer — remote HTML can never execute in local browsers.
    const SAFE_TAGS = new Set(['A', 'ABBR', 'B', 'BLOCKQUOTE', 'BR', 'CODE', 'DEL', 'DIV', 'EM', 'FONT', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'HR', 'I', 'IMG', 'LI', 'OL', 'P', 'PRE', 'S', 'SPAN', 'STRIKE', 'STRONG', 'SUB', 'SUP', 'U', 'UL']);
    const DROP_TAGS = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'FRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'BASE', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'VIDEO', 'AUDIO', 'SOURCE', 'TRACK', 'MATH', 'SVG']);
    const SAFE_URL = /^(https?:|data:image\/)/i;
    const sanitizeHTML = (html) => {
      const tpl = document.createElement('template');
      tpl.innerHTML = html ?? '';
      // Presence artifacts (remote cursors/selections) must never persist as content.
      tpl.content.querySelectorAll('.cursor, .selection-rect').forEach(el => el.remove());
      for (const el of [...tpl.content.querySelectorAll('*')]) {
        if (DROP_TAGS.has(el.tagName)) { el.remove(); continue; }
        if (!SAFE_TAGS.has(el.tagName)) { el.replaceWith(...el.childNodes); continue; }
        for (const { name, value } of [...el.attributes]) {
          const keep =
            (name === 'href' || name === 'src') ? SAFE_URL.test(value.trim()) :
              (name === 'style') ? !/url\s*\(|expression\s*\(/i.test(value) :
                ['color', 'face', 'size', 'align', 'target', 'rel'].includes(name);
          if (!keep) el.removeAttribute(name);
        }
        if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
      }
      return tpl.innerHTML;
    };

    // Helpers for contenteditable
    // getEditorHTML strips the live presence overlays so cursors are never sent or saved as document content.
    const getEditorHTML = () => {
      const tpl = document.createElement('template');
      tpl.innerHTML = editor.innerHTML;
      tpl.content.querySelectorAll('.cursor, .selection-rect').forEach(el => el.remove());
      return tpl.innerHTML;
    };

    // A repaint replaces the whole DOM, so a cloned Range is left pointing at
    // destroyed nodes. Measure the caret as a plain character offset into the
    // editor's text and put it back there afterwards: a remote edit elsewhere
    // in the document must not throw the local caret to the start of it. (The
    // presence overlays are empty divs — they add no characters to the count.)
    const caretOffset = () => {
      const sel = getSelection();
      if (!sel?.rangeCount || !editor.contains(sel.anchorNode)) return null;
      const range = sel.getRangeAt(0), upToCaret = range.cloneRange();
      upToCaret.selectNodeContents(editor);
      upToCaret.setEnd(range.endContainer, range.endOffset);
      return upToCaret.toString().length;
    };

    const putCaretAt = (offset) => {
      const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
      const range = document.createRange();
      let seen = 0, node;
      while ((node = walker.nextNode()) && seen + node.length < offset) seen += node.length;
      if (node) { range.setStart(node, offset - seen); range.collapse(true); }
      else { range.selectNodeContents(editor); range.collapse(false); } // the text is shorter now
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    };

    const setEditorHTML = (html) => {
      const at = caretOffset();
      editor.innerHTML = sanitizeHTML(html);
      if (at !== null) putCaretAt(at);
      // The overlay elements were just wiped with the old DOM; drop the stale refs
      // so the next cursor message recreates them cleanly.
      for (const k of Object.keys(cursorMap)) delete cursorMap[k];
    };
    const focusEditor = () => { editor.focus(); };
    // line numbers removed

    // Live word count
    const updateWordCount = () => {
      if (!wordCountEl) return;
      try {
        const text = (editor.innerText || '').trim();
        const words = text ? (text.match(/\S+/g) || []).length : 0;
        wordCountEl.textContent = `${words} ${words === 1 ? 'word' : 'words'}`;
      } catch { }
    };

    // Lightweight HTML -> Markdown converter (best-effort; not 100% accurate)
    const htmlToMarkdown = (html) => {
      try {
        const tmp = document.createElement('div');
        tmp.innerHTML = html || '';
        // <br> to newline
        tmp.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
        // Bold/Strong
        tmp.querySelectorAll('b,strong').forEach(el => el.replaceWith(`**${el.textContent}**`));
        // Italic/Em
        tmp.querySelectorAll('i,em').forEach(el => el.replaceWith(`*${el.textContent}*`));
        // Underline (approximation)
        tmp.querySelectorAll('u').forEach(el => el.replaceWith(`_${el.textContent}_`));
        // Strikethrough
        tmp.querySelectorAll('s,strike,del').forEach(el => el.replaceWith(`~~${el.textContent}~~`));
        // Inline code
        tmp.querySelectorAll('code').forEach(el => el.replaceWith('`' + el.textContent + '`'));
        // Code blocks
        tmp.querySelectorAll('pre').forEach(el => el.replaceWith('\n\n```\n' + el.textContent + '\n```\n\n'));
        // Links
        tmp.querySelectorAll('a').forEach(a => a.replaceWith('[' + (a.textContent || '') + '](' + (a.getAttribute('href') || '') + ')'));
        // Headings
        for (let i = 1; i <= 6; i++) {
          tmp.querySelectorAll('h' + i).forEach(h => h.replaceWith('\n\n' + '#'.repeat(i) + ' ' + h.textContent + '\n\n'));
        }
        // Blockquotes
        tmp.querySelectorAll('blockquote').forEach(q => {
          const lines = (q.textContent || '').split(/\n/).map(l => '> ' + l).join('\n');
          q.replaceWith('\n\n' + lines + '\n\n');
        });
        // Lists
        tmp.querySelectorAll('ul').forEach(ul => {
          const lines = Array.from(ul.querySelectorAll(':scope > li')).map(li => '- ' + li.textContent).join('\n');
          ul.replaceWith('\n' + lines + '\n');
        });
        tmp.querySelectorAll('ol').forEach(ol => {
          const items = Array.from(ol.querySelectorAll(':scope > li')).map((li, i) => (i + 1) + '. ' + li.textContent).join('\n');
          ol.replaceWith('\n' + items + '\n');
        });
        // Paragraphs
        tmp.querySelectorAll('p').forEach(p => p.replaceWith('\n\n' + p.textContent + '\n\n'));
        // Collapse excessive newlines
        return (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
      } catch {
        return html || '';
      }
    };

    // Dependency-free HTML pretty-printer: walks the live DOM tree and emits the
    // source indented and syntax-colored (.hl-* tokens). All dynamic content is
    // escaped, so injecting the result into the preview pane is safe.
    const escapeHTML = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const VOID_TAGS = new Set(['AREA', 'BASE', 'BR', 'COL', 'EMBED', 'HR', 'IMG', 'INPUT', 'LINK', 'META', 'SOURCE', 'TRACK', 'WBR']);
    const INLINE_TAGS = new Set(['A', 'ABBR', 'B', 'BR', 'CODE', 'DEL', 'EM', 'FONT', 'I', 'IMG', 'S', 'SPAN', 'STRIKE', 'STRONG', 'SUB', 'SUP', 'U']);
    const isInlineOnly = (node) => [...node.childNodes].every(k =>
      k.nodeType === Node.TEXT_NODE ||
      (k.nodeType === Node.ELEMENT_NODE && INLINE_TAGS.has(k.tagName) && isInlineOnly(k)));
    const renderOpenTag = (el) => {
      const attrs = [...el.attributes].map(a =>
        ` <span class="hl-attr">${escapeHTML(a.name)}</span>` +
        (a.value !== '' ? `<span class="hl-punct">=</span><span class="hl-str">"${escapeHTML(a.value)}"</span>` : '')
      ).join('');
      return `<span class="hl-punct">&lt;</span><span class="hl-tag">${el.tagName.toLowerCase()}</span>${attrs}<span class="hl-punct">&gt;</span>`;
    };
    const renderCloseTag = (el) =>
      `<span class="hl-punct">&lt;/</span><span class="hl-tag">${el.tagName.toLowerCase()}</span><span class="hl-punct">&gt;</span>`;
    const renderInline = (node) => {
      if (node.nodeType === Node.TEXT_NODE) return `<span class="hl-text">${escapeHTML(node.textContent)}</span>`;
      if (node.nodeType !== Node.ELEMENT_NODE) return '';
      if (VOID_TAGS.has(node.tagName)) return renderOpenTag(node);
      return renderOpenTag(node) + [...node.childNodes].map(renderInline).join('') + renderCloseTag(node);
    };
    const renderBlock = (node, depth) => {
      const pad = '  '.repeat(depth);
      if (node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent.trim();
        return text ? `${pad}<span class="hl-text">${escapeHTML(text)}</span>\n` : '';
      }
      if (node.nodeType === Node.COMMENT_NODE)
        return `${pad}<span class="hl-comment">&lt;!--${escapeHTML(node.textContent)}--&gt;</span>\n`;
      if (node.nodeType !== Node.ELEMENT_NODE) return '';
      if (VOID_TAGS.has(node.tagName)) return pad + renderOpenTag(node) + '\n';
      if (isInlineOnly(node))
        return pad + renderOpenTag(node) + [...node.childNodes].map(renderInline).join('') + renderCloseTag(node) + '\n';
      const kids = [...node.childNodes].map(k => renderBlock(k, depth + 1)).join('');
      return `${pad}${renderOpenTag(node)}\n${kids}${pad}${renderCloseTag(node)}\n`;
    };
    const highlightHTML = (html) => {
      const tpl = document.createElement('template');
      tpl.innerHTML = html ?? '';
      return [...tpl.content.childNodes].map(n => renderBlock(n, 0)).join('')
        || '<span class="hl-comment">(empty document)</span>';
    };

    const updatePreview = () => {
      if (!previewContent) return;
      const html = getEditorHTML();
      const mode = previewModeSel && previewModeSel.value ? previewModeSel.value : 'markdown';
      previewContent.classList.toggle('html-mode', mode === 'html');
      if (mode === 'html') {
        previewContent.innerHTML = highlightHTML(html); // tokens built locally, fully escaped
      } else {
        previewContent.textContent = htmlToMarkdown(html);
      }
    };
    if (previewModeSel) previewModeSel.addEventListener('change', updatePreview);

    // Splitter logic: mouse/touch drag + keyboard
    const MIN_LEFT = 280; // px
    const MIN_RIGHT = 280; // px
    const saveSplit = (px) => {
      try { localStorage.setItem('collab2.split.leftWidth', String(px)); } catch { }
    };
    const loadSplit = () => {
      try { const v = parseInt(localStorage.getItem('collab2.split.leftWidth') || '', 10); return isFinite(v) ? v : null; } catch { return null; }
    };
    const saveHidden = (hidden) => {
      try { localStorage.setItem('collab2.preview.hidden', hidden ? '1' : '0'); } catch { }
    };
    const loadHidden = () => {
      try { return localStorage.getItem('collab2.preview.hidden') === '1'; } catch { return false; }
    };
    const applySplit = (leftPx) => {
      const total = editorWrap.clientWidth; // global from DOM
      const clamped = Math.max(MIN_LEFT, Math.min(total - MIN_RIGHT - splitter.offsetWidth, leftPx));
      editorPane.style.width = clamped + 'px';
      previewPane.style.width = (total - clamped - splitter.offsetWidth) + 'px';
      splitter.setAttribute('aria-valuenow', String(clamped));
    };
    let dragging = false;
    const onMove = (clientX) => {
      const rect = editorWrap.getBoundingClientRect();
      const leftPx = clientX - rect.left;
      applySplit(leftPx);
    };
    if (splitter) {
      splitter.addEventListener('mousedown', (e) => { dragging = true; splitter.classList.add('dragging'); e.preventDefault(); });
      window.addEventListener('mousemove', (e) => { if (!dragging) return; onMove(e.clientX); });
      window.addEventListener('mouseup', () => { if (!dragging) return; dragging = false; splitter.classList.remove('dragging'); saveSplit(parseInt(editorPane.style.width || '0', 10)); });
      // Touch
      splitter.addEventListener('touchstart', (e) => { dragging = true; splitter.classList.add('dragging'); });
      window.addEventListener('touchmove', (e) => { if (!dragging) return; const t = e.touches[0]; onMove(t.clientX); });
      window.addEventListener('touchend', () => { if (!dragging) return; dragging = false; splitter.classList.remove('dragging'); saveSplit(parseInt(editorPane.style.width || '0', 10)); });
      // Keyboard arrows
      splitter.addEventListener('keydown', (e) => {
        const step = (e.shiftKey ? 50 : 10);
        const total = editorWrap.clientWidth;
        const current = parseInt(editorPane.style.width || String(Math.floor(total / 2)), 10);
        if (e.key === 'ArrowLeft') { applySplit(current - step); saveSplit(parseInt(editorPane.style.width || '0', 10)); e.preventDefault(); }
        if (e.key === 'ArrowRight') { applySplit(current + step); saveSplit(parseInt(editorPane.style.width || '0', 10)); e.preventDefault(); }
      });
    }
    // Apply saved split on load
    const saved = loadSplit();
    if (saved) applySplit(saved);
    // Apply hidden state
    let previewHidden = loadHidden();
    let lastLeftBeforeHide = null;
    const setPreviewHidden = (hidden) => {
      previewHidden = hidden;
      if (hidden) {
        // store current left width to restore later
        lastLeftBeforeHide = parseInt(editorPane.style.width || '0', 10) || Math.floor(editorWrap.clientWidth * 0.5);
        previewPane.style.display = 'none';
        splitter.style.display = 'none';
        editorPane.style.width = '100%';
        togglePreviewBtn?.setAttribute('aria-pressed', 'true');
      } else {
        previewPane.style.display = 'flex';
        splitter.style.display = 'block';
        const base = saved || lastLeftBeforeHide || Math.floor(editorWrap.clientWidth * 0.5);
        applySplit(base);
        togglePreviewBtn?.setAttribute('aria-pressed', 'false');
      }
      saveHidden(hidden);
    };
    setPreviewHidden(previewHidden);
    window.addEventListener('resize', () => {
      const total = editorWrap.clientWidth;
      const current = parseInt(editorPane.style.width || String(Math.floor(total / 2)), 10);
      applySplit(current);
    });

    // Button handlers
    togglePreviewBtn?.addEventListener('click', () => setPreviewHidden(!previewHidden));
    resetSplitBtn?.addEventListener('click', () => {
      if (previewHidden) setPreviewHidden(false);
      const total = editorWrap.clientWidth;
      const fifty = Math.floor(total / 2);
      applySplit(fifty);
      saveSplit(fifty);
    });

    // Selection helpers to ensure toolbar actions apply to intended text
    let savedRange = null;
    const saveSelection = () => {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
    };
    const restoreSelection = () => {
      if (!savedRange) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    };
    // Save selection when interacting with toolbar
    document.getElementById('toolbar').addEventListener('mousedown', (e) => {
      // Don't steal drag from selecting text in editor
      if (!editor.contains(e.target)) saveSelection();
    });
    const sideTb = document.getElementById('sideToolbar');
    if (sideTb) {
      sideTb.addEventListener('mousedown', (e) => {
        if (!editor.contains(e.target)) saveSelection();
      });
    }

    // Ensure icons visible: if SVG not supported/rendered, show fallback emoji
    const ensureIconsVisible = () => {
      document.querySelectorAll('#toolbar .icon-btn, #sideToolbar .icon-btn').forEach(btn => {
        const svg = btn.querySelector('svg');
        const fb = btn.querySelector('.fallback');
        try {
          const ok = !!(svg && svg.getBBox && svg.getBBox().width > 0);
          if (!ok && fb) {
            svg && (svg.style.display = 'none');
            fb.style.display = 'block';
          }
        } catch {
          if (svg) svg.style.display = 'none';
          if (fb) fb.style.display = 'block';
        }
      });
    };

    // Update status — three fixed segments so each keeps its own click
    // affordance: peers (toggles the versions panel), role hint (opens the
    // identity modal while signed out), save flash (plain text).
    const updateStatus = () => {
      statusPeers.textContent = `${peerCount} ${peerCount === 1 ? 'peer' : 'peers'}`;
      statusRole.textContent = !myAddress ? 'Read-only — sign in to edit'
        : !can('write') ? `${myRole ?? 'guest'} — read-only while the editor role arrives`
          : `${myRole} — may edit`;
      // Signed out, the hint is the way back to the door.
      statusRole.classList.toggle('reopen', !myAddress);
      statusRole.title = myAddress ? '' : 'Open the identity door';
      statusSaved.textContent = Date.now() < showSavedUntil ? 'Saved' : '';
    };
    // History opens as a dialog from the toolbar — not from the peer counter,
    // because the status bar reports what is true and never acts. Nothing is
    // persisted about it: a dialog is opened when it is wanted, and restoring
    // one on load would put a sheet over the document you came to read.
    toggleVersionsBtn.addEventListener('click', () => historyModal.showModal());
    historyModal.addEventListener('click', (e) => { if (e.target === historyModal) historyModal.close(); });

    // ============================== UI feedback ==============================
    // The canonical toast (§6). Never alert(): it blocks the thread, which in a
    // P2P app freezes the very sync being demonstrated, and a screen reader
    // never hears it. Three, rotating — the oldest drops as newer ones arrive.
    const MAX_TOASTS = 3;
    const TOAST_ICONS = { info: 'ⓘ', success: '✓', error: '✕', warning: '!' };

    const dropToast = (node) => {
      node.classList.add('out');
      setTimeout(() => {
        node.remove();
        if (!toastsEl.children.length && toastsEl.matches(':popover-open')) toastsEl.hidePopover();
      }, 400);
    };

    /** @param {string} message @param {'info'|'success'|'error'|'warning'} [kind='info'] */
    const toast = (message, kind = 'info') => {
      const node = document.createElement('div');
      node.className = `toast ${kind}`;

      const icon = document.createElement('span');
      icon.className = 'toast-icon';
      icon.textContent = TOAST_ICONS[kind] ?? TOAST_ICONS.info;

      const text = document.createElement('span');
      text.className = 'toast-text';
      text.textContent = message;

      node.append(icon, text);
      node.onclick = () => dropToast(node);

      if (!toastsEl.matches(':popover-open')) toastsEl.showPopover();
      toastsEl.appendChild(node);
      while (toastsEl.children.length > MAX_TOASTS) dropToast(toastsEl.firstElementChild);
      setTimeout(() => node.isConnected && dropToast(node), 3000);
    };
    // Minimalist "Saved" flash next to the peer counter.
    const flashSaved = () => {
      showSavedUntil = Date.now() + 1500;
      updateStatus();
      if (savedFlashTimer) clearTimeout(savedFlashTimer);
      savedFlashTimer = setTimeout(() => updateStatus(), 1600);
    };

    // ========================= Identity & governance =========================
    // Role check walking the inherits chain of ROLES. Client-side UX only —
    // peers verify every persistent operation cryptographically regardless.
    const can = (permission) => {
      let role = myRole;
      while (role && ROLES[role]) {
        if (ROLES[role].can.includes(permission)) return true;
        role = ROLES[role].inherits?.[0];
      }
      return false;
    };

    // Gate the editing surface by the LIVE role. The document, remote cursors
    // and video stay visible to everyone — collaboration is public to read.
    const applyPermissionsToUI = () => {
      const canWrite = can('write');
      editor.setAttribute('contenteditable', String(canWrite));
      document.querySelectorAll('#toolbar button, #toolbar select, #sideToolbar button, #sideToolbar input')
        .forEach(el => { el.disabled = !canWrite; });
      // Presence by degrees: watching and live cursors stay anonymous, but
      // broadcasting yourself (camera/mic) requires a signed-in identity.
      startVideoBtn.disabled = !myAddress;
      startVideoBtn.title = myAddress ? 'Start video' : 'Sign in to share your camera';
      renderVersions(); // the admin-only delete affordance follows the live role
      updateStatus();
    };

    /**
     * Passkeys need two things, and only the first is obvious: a secure
     * context, and a valid Relying Party ID — which WebAuthn takes from the
     * hostname and requires to be a *domain*. An IP is not, so 127.0.0.1
     * passes every check you would think to make and then fails at
     * registration with "This is an invalid domain".
     */
    const PASSKEYS_AVAILABLE =
      window.isSecureContext &&
      !!window.PublicKeyCredential &&
      !/^\d{1,3}(\.\d{1,3}){3}$/.test(location.hostname); // an IP is never an RP ID

    const show = (node, on) => node.classList.toggle('hidden', !on);

    /** Grow to fit: compact when empty, whole phrase visible when filled. */
    const autoGrow = () => {
      mnemonicBox.style.height = 'auto';
      // scrollHeight excludes borders, and box-sizing counts them in height.
      const borders = mnemonicBox.offsetHeight - mnemonicBox.clientHeight;
      mnemonicBox.style.height = `${mnemonicBox.scrollHeight + borders}px`;
    };

    /** Copy only, and only when there is something to copy: reading the
        clipboard raises a permission prompt, writing does not. */
    const syncClipAffordance = () => show(mnemonicClip, !!mnemonicBox.value.trim());

    /**
     * The door is drawn from the security state, never from local flags. The
     * SM already publishes the phase, and the three-phase state machine this
     * replaces was a second source of truth for the same thing.
     */
    const renderIdentityModal = ({ isActive, hasVolatileIdentity, hasWebAuthnHardwareRegistration, isWebAuthnProtected }) => {
      // `hasVolatileIdentity` stays true after signing in with a fresh phrase —
      // the identity lives in memory until a passkey secures it. Onboarding
      // ends the moment you are in, and the phrase must not outlive it.
      const onboarding = hasVolatileIdentity && !isActive;

      show(generateBtn, !onboarding);
      show(passkeyProtectBtn, onboarding && PASSKEYS_AVAILABLE && !isWebAuthnProtected);
      show(passkeyLoginBtn, !onboarding && PASSKEYS_AVAILABLE && hasWebAuthnHardwareRegistration);
      show(demoLoginBtn, !onboarding);   // never invite abandoning an unsaved phrase
      show(phraseWarning, onboarding);   // only a fresh phrase can still be lost
      mnemonicBox.readOnly = onboarding;

      // The phrase is the SM's to hand over — the app never keeps a copy.
      if (onboarding) {
        mnemonicBox.value = db.sm.getMnemonicForDisplayAfterRegistrationOrRecovery() ?? mnemonicBox.value;
      } else if (isActive || document.activeElement !== mnemonicBox) {
        mnemonicBox.value = ''; // signed in: always clear. Signed out: never mid-paste.
      }

      syncClipAffordance();
      autoGrow();
    };

    // Reactive role watcher: db.get(user:<address>, cb) fires on every signed
    // role change (governance promotions land here live).
    //
    // Superadmin status is special: the engine derives it from the LOCAL
    // superAdmins config — verification and governance immunity both check the
    // list, never the node — so the UI must do the same. The user node is only
    // a synced mirror, and a mirror can lag (or lose a LWW race with another
    // peer's welcome write); trusting it would show a working superadmin as a
    // locked-out guest.
    const effectiveRole = (nodeRole) =>
      SUPER_ADMINS.includes(myAddress) ? 'superadmin' : (nodeRole ?? 'guest');

    let unsubRole = null;
    const applyRoleUpdate = (nodeRole, nodeSeen) => {
      const next = effectiveRole(nodeRole);
      if (next === myRole) return;
      const hadWrite = can('write');
      const firstSight = myRole === null;
      myRole = next;
      roleBadge.textContent = myRole;
      roleBadge.dataset.role = myRole;
      applyPermissionsToUI();
      if (!hadWrite && can('write')) toast(`Write access unlocked — role: ${myRole}`);
      // Only announce "guest" once the node has actually arrived — a null
      // during sync is not a standing, just a mirror that hasn't landed yet.
      else if (firstSight && nodeSeen && next === 'guest') toast('Signed in as guest — the editor role arrives in ~10 s while a superadmin is online');
    };
    const watchMyRole = async () => {
      unsubRole?.();
      if (SUPER_ADMINS.includes(myAddress)) applyRoleUpdate(null, 'info'); // config-declared, no sync needed
      ({ unsubscribe: unsubRole } = await db.get(`user:${myAddress}`, (node) =>
        applyRoleUpdate(node?.value?.role, !!node)));
    };

    /**
     * One callback draws the whole session: the top bar, the door, and every
     * gated control. It is the single source of truth, and nothing else calls
     * showModal() — not even at boot.
     *
     * Every branch is idempotent, which matters because the SM fires this
     * several times while an identity is being generated: a callback that
     * *remembers* would eventually act on a repeat and wipe a phrase that was
     * never written down. One that only redraws cannot.
     */
    const onSecurityState = (state) => {
      const { isActive, activeAddress, abbrAddr } = state;

      sessionAddrBtn.textContent = isActive ? (abbrAddr || shortAddr(activeAddress) || '') : '';
      show(logoutBtn, isActive);

      if (isActive) {
        myAddress = activeAddress;
        watchMyRole();
      } else {
        unsubRole?.(); unsubRole = null;
        myAddress = null; myRole = null;
        roleBadge.textContent = '';
        roleBadge.dataset.role = '';
        queueMicrotask(() => applyPermissionsToUI());
      }

      renderIdentityModal(state);

      // The document subscription is NOT touched here: it is subscribed once
      // at boot and lives for the whole page.
      if (isActive) return identityModal.close();
      if (!identityModal.open) identityModal.showModal(); // signed out *is* the modal's state
    };
    db.sm.setSecurityStateChangeCallback(onSecurityState);

    // No standing Sign-in button: the door auto-opens while signed out, and
    // re-entry is contextual — the read-only status hint re-opens it.
    statusRole.addEventListener('click', () => {
      if (!myAddress && !identityModal.open) identityModal.showModal();
    });

    // Dismissible: everyone can read the document and watch live edits, so a
    // visitor has something real behind the door. No × close button — a corner
    // × reads as window chrome and invites closing before the phrase is saved.
    identityModal.addEventListener('click', (e) => { if (e.target === identityModal) identityModal.close(); });
    mnemonicBox.addEventListener('input', () => { syncClipAffordance(); autoGrow(); });

    // Each action is a single SM call plus a toast on failure. The success path
    // never toasts here — the session callback is what tells you that you are in.
    generateBtn.addEventListener('click', async () => {
      try {
        if (!await db.sm.startNewUserRegistration()) return toast('Could not generate an identity', 'error');
        // No UI here: the state change fires and renderIdentityModal draws it.
        toast('Identity generated — save the phrase before you leave', 'success');
      } catch { toast('Could not generate an identity', 'error'); }
    });

    loginBtn.addEventListener('click', async () => {
      const mnemonic = mnemonicBox.value.trim();
      if (!mnemonic) return toast('Paste a mnemonic phrase first', 'error');
      try {
        // One method for both cases: a phrase this device has never seen
        // recovers the identity rather than failing.
        if (!await db.sm.loginOrRecoverUserWithMnemonic(mnemonic)) toast('That mnemonic is not valid', 'error');
      } catch { toast('That mnemonic is not valid', 'error'); }
    });

    passkeyLoginBtn.addEventListener('click', async () => {
      try {
        if (!await db.sm.loginCurrentUserWithWebAuthn()) toast('Passkey login cancelled', 'error');
      } catch { toast('Could not sign in with the passkey', 'error'); }
    });

    passkeyProtectBtn.addEventListener('click', async () => {
      try {
        if (!await db.sm.protectCurrentIdentityWithWebAuthn()) toast('Passkey registration cancelled', 'error');
      } catch { toast('Could not register the passkey', 'error'); }
    });

    mnemonicClip.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(mnemonicBox.value);
        toast('Phrase copied to clipboard', 'success');
      } catch {
        // The phrase is already on screen; say so rather than failing silently.
        toast('Clipboard unavailable — select the phrase and copy it', 'warning');
      }
    });

    sessionAddrBtn.addEventListener('click', async () => {
      if (!myAddress) return;
      try {
        await navigator.clipboard.writeText(myAddress);
        toast('Address copied to clipboard', 'success');
      } catch { toast('Clipboard unavailable', 'warning'); }
    });

    // One-click demo superadmin: runs the governance engine in this browser,
    // which is what promotes everyone else to `editor`.
    demoLoginBtn.addEventListener('click', async () => {
      try { await db.sm.loginOrRecoverUserWithMnemonic(DEMO_SUPERADMIN.mnemonic); }
      catch { toast('Could not sign in as the demo superadmin', 'error'); }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await db.sm.clearSecurity();
        // Signed-out IS the modal's welcome phase (the state callback set it);
        // dismiss (backdrop / Esc) to keep reading as a guest.
        toast('Signed out');
      } catch { toast('Could not sign out', 'error'); }
    });

    // Handle peer joins/leaves
    room.on('peer:join', (peerId) => {
      peerCount++;
      updateStatus();
      // Editors send the current doc to the new peer for an instant view; other
      // peers receive it anyway through the signed graph sync moments later.
      const current = getEditorHTML();
      if (current && can('write')) {
        docChannel.send({ content: current, ts: lastTimestamp }, peerId);
      }
    });
    room.on('peer:leave', (peerId) => {
      peerCount--;
      updateStatus();
      if (cursorMap[peerId]) {
        cursorMap[peerId].cursor?.remove();
        cursorMap[peerId].rects?.forEach(el => el.remove());
        delete cursorMap[peerId];
      }
      if (peerVideos[peerId]) {
        // The tile, not just the <video>: removing the picture alone would
        // leave its label floating in the strip.
        peerVideos[peerId].closest('.video-tile')?.remove();
        delete peerVideos[peerId];
      }
    });

    // Handle live document updates via channel.
    // DESIGN NOTE — trust boundary: GenosRTC channels are ephemeral and do NOT
    // go through the graph's RBAC (only persistent operations are verified by
    // signature). The role gate on the editor UI keeps honest peers silent as
    // guests, but the SIGNED GRAPH is the source of truth: whatever arrives
    // here is a transient view, corrected by the next db.get repaint.
    docChannel.on('message', (data, fromPeerId) => {
      if (data.ts > lastTimestamp) {
        lastTimestamp = data.ts;
        setEditorHTML(data.content);
        updatePreview();
        updateWordCount();
      }
    });

    // Video chat — broadcasting yourself requires a signed-in identity
    /** One tile per camera: the picture, and a label saying whose it is. */
    const makeVideoTile = (label, isSelf) => {
      const tile = document.createElement('div');
      tile.className = isSelf ? 'video-tile is-self' : 'video-tile';

      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      if (isSelf) video.muted = true; // never play your own microphone back at you

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = label;

      tile.append(video, tag);
      videoContainer.appendChild(tile);
      return video;
    };

    // Broadcasting is a toggle, not a one-way door. It used to hide its own
    // button on start, which left the camera light on with no way to turn it
    // off short of reloading the page.
    let localStream = null;
    let selfTile = null;

    const stopBroadcast = () => {
      if (!localStream) return;
      db.room.removeStream(localStream);
      localStream.getTracks().forEach(track => track.stop()); // releases the camera light
      localStream = null;
      selfTile?.closest('.video-tile')?.remove();
      selfTile = null;
      startVideoBtn.setAttribute('aria-pressed', 'false');
      startVideoBtn.title = 'Start video';
    };

    startVideoBtn.addEventListener('click', async () => {
      if (!myAddress) return toast('Sign in to share your camera', 'error');
      if (localStream) return stopBroadcast();
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        db.room.addStream(localStream);
        // Show yourself too: without it there is no feedback that the camera
        // is actually on, and the first thing anyone checks is their own frame.
        selfTile = makeVideoTile('you', true);
        selfTile.srcObject = localStream;
        startVideoBtn.setAttribute('aria-pressed', 'true');
          startVideoBtn.title = 'Stop video';
      } catch (error) {
        localStream = null;
        toast('Could not access camera/microphone: ' + (error?.message || error), 'error');
      }
    });

    db.room.on('stream:add', (stream, peerId) => {
      if (stream.getVideoTracks().length === 0) return;
      let video = peerVideos[peerId];
      if (!video) {
        video = makeVideoTile(shortAddr(peerId) || String(peerId).slice(0, 6), false);
        peerVideos[peerId] = video;
      }
      video.srcObject = stream; // always refresh — peers may restart their stream
    });

    // Load the doc if this peer already has it. NO bootstrap write: a virgin
    // peer booting before sync must not materialize an empty doc — its newer
    // LWW timestamp would wipe the shared content for everyone. The reactive
    // subscription below paints the document as soon as sync delivers it,
    // and the first real edit creates the node.
    const { result: initialDoc } = await db.get(docId);
    if (initialDoc) {
      setEditorHTML(initialDoc.value.content || '');
      lastTimestamp = initialDoc.timestamp ? initialDoc.timestamp.physical : Date.now();
    }
    // Ensure preview is correct on load
    updateWordCount();
    updatePreview();
    ensureIconsVisible();

    // Real-time document updates from the graph. db.get(id, cb) is the canonical
    // single-node subscription: a direct lookup with built-in HLC gating (the
    // callback only fires when the node's hybrid-clock timestamp actually advances).
    const { unsubscribe } = await db.get(docId, (node) => {
      if (!node?.value) return;
      const incoming = node.value.content || '';
      // Skip echoes of our own debounced save and states already applied via the
      // live channel — repainting identical content would destroy the local caret.
      if (incoming === getEditorHTML()) return;
      const ts = node.timestamp?.physical ?? 0;
      if (ts <= lastTimestamp) return;
      lastTimestamp = ts;
      setEditorHTML(incoming);
      updateWordCount();
      updatePreview();
    });

    // Live broadcast while typing (throttled) + save when user stops (debounced).
    // NOTE — concurrency model: the whole document is ONE graph node resolved by
    // LWW + Hybrid Logical Clock, so simultaneous edits resolve to the last writer
    // (no per-character merge). Ideal for demos and small teams; for char-level
    // merging integrate a CRDT (e.g. Yjs) and keep GenosDB as transport + storage.
    editor.addEventListener('input', async () => {
      if (!can('write')) return; // read-only until governance grants `editor`
      const now = Date.now();
      pendingContent = getEditorHTML();
      updateWordCount();
      updatePreview();

      // Live send: throttled ephemeral broadcast for the real-time feel
      const sendLive = () => {
        // HLC-style bump: never emit a ts behind the newest one seen, so a peer
        // with a slow wall clock is not silently ignored by the others.
        const ts = Math.max(Date.now(), lastTimestamp + 1);
        if (ts > lastTimestamp) lastTimestamp = ts;
        docChannel.send({ content: pendingContent, ts });
        lastLiveSent = ts;
        liveScheduled = null;
      };

      if (now - lastLiveSent >= liveThrottleMs) {
        sendLive();
      } else if (!liveScheduled) {
        liveScheduled = setTimeout(sendLive, liveThrottleMs - (now - lastLiveSent));
      }

      // Debounced persistent save — a signed write every honest peer verifies.
      clearTimeout(saveDebounceTimer);
      isSaving = true; // indicate intent to save soon
      updateStatus();
      saveDebounceTimer = setTimeout(async () => {
        try {
          await db.sm.executeWithPermission("write"); // throws for non-editors
          const ts = Date.now();
          if (ts > lastTimestamp) lastTimestamp = ts;
          await db.put({ content: pendingContent }, docId);
          flashSaved();
        } catch {
          toast('Not saved — the editor role is required to persist changes', 'error');
        } finally {
          isSaving = false;
          updateStatus();
        }
      }, 600);
    });

    // line numbers and gutter scroll sync removed

    // Formatting buttons
    const execCmd = (cmd) => {
      restoreSelection();
      document.execCommand(cmd, false, null);
      focusEditor();
    };
    btnBold.addEventListener('click', () => execCmd('bold'));
    btnItalic.addEventListener('click', () => execCmd('italic'));
    btnUnderline.addEventListener('click', () => execCmd('underline'));
    btnStrike.addEventListener('click', () => execCmd('strikethrough'));

    // Color picker
    colorPicker.addEventListener('change', () => {
      restoreSelection();
      document.execCommand('foreColor', false, colorPicker.value);
      focusEditor();
    });

    // Link insertion
    btnLink.addEventListener('click', () => {
      restoreSelection();
      const sel = window.getSelection();
      const hasSelection = sel && !sel.isCollapsed;
      let url = prompt('Enter URL', 'https://');
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      if (hasSelection) {
        document.execCommand('createLink', false, url);
      } else {
        const text = prompt('Text to display', url) || url;
        document.execCommand('insertHTML', false, `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`);
      }
      focusEditor();
    });
    btnUnlink.addEventListener('click', () => execCmd('unlink'));

    // Block formatting
    blockFormat.addEventListener('change', () => {
      restoreSelection();
      const val = blockFormat.value;
      document.execCommand('formatBlock', false, val);
      focusEditor();
    });

    // (font size selector removed)

    // Lists
    btnUl.addEventListener('click', () => execCmd('insertUnorderedList'));
    btnOl.addEventListener('click', () => execCmd('insertOrderedList'));

    // Alignment
    btnLeft.addEventListener('click', () => execCmd('justifyLeft'));
    btnCenter.addEventListener('click', () => execCmd('justifyCenter'));
    btnRight.addEventListener('click', () => execCmd('justifyRight'));

    // History
    btnUndo.addEventListener('click', () => execCmd('undo'));
    btnRedo.addEventListener('click', () => execCmd('redo'));

    // Clear formatting (keeps links unless selection includes them)
    btnClear.addEventListener('click', () => execCmd('removeFormat'));

    // Cursor + selection tracking
    const peerStyles = {};
    const ensurePeerStyle = (peerId) => {
      if (peerStyles[peerId]) return peerStyles[peerId];
      const color = `#${Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0')}`;
      peerStyles[peerId] = { color };
      return peerStyles[peerId];
    };
    const sendCursorPos = () => {
      try {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        const collapsed = range.collapsed;
        // Cursor position
        const caretRange = range.cloneRange();
        caretRange.collapse(true);
        const caretRect = caretRange.getBoundingClientRect();
        const hostRect = editor.getBoundingClientRect();
        const left = Math.max(0, caretRect.left - hostRect.left + editor.scrollLeft);
        const top = Math.max(0, caretRect.top - hostRect.top + editor.scrollTop);
        // Selection rects
        let rects = [];
        if (!collapsed) {
          const r = range.cloneRange();
          const clientRects = Array.from(r.getClientRects());
          rects = clientRects.map(cr => ({
            left: Math.max(0, cr.left - hostRect.left + editor.scrollLeft),
            top: Math.max(0, cr.top - hostRect.top + editor.scrollTop),
            width: cr.width,
            height: cr.height
          }));
        }
        cursorChannel.send({ left, top, rects, ts: Date.now() });
      } catch { }
    };
    editor.addEventListener('keyup', sendCursorPos);
    editor.addEventListener('mouseup', sendCursorPos);
    editor.addEventListener('input', sendCursorPos);

    cursorChannel.on('message', (data, peerId) => {
      const { color } = ensurePeerStyle(peerId);
      // Cursor element
      if (!cursorMap[peerId]) {
        const cursor = document.createElement('div');
        cursor.className = 'cursor';
        cursor.style.backgroundColor = color;
        editor.appendChild(cursor);
        cursorMap[peerId] = { cursor, rects: [] };
      }
      const entry = cursorMap[peerId];
      entry.cursor.style.left = `${data.left}px`;
      entry.cursor.style.top = `${data.top}px`;
      // Clear old selection rects
      if (entry.rects && entry.rects.length) {
        entry.rects.forEach(el => el.remove());
      }
      entry.rects = [];
      // Draw new selection rects
      if (Array.isArray(data.rects)) {
        data.rects.forEach(r => {
          const el = document.createElement('div');
          el.className = 'selection-rect';
          el.style.left = `${r.left}px`;
          el.style.top = `${r.top}px`;
          el.style.width = `${r.width}px`;
          el.style.height = `${r.height}px`;
          el.style.backgroundColor = color + '40'; // hex with transparency approx
          editor.appendChild(el);
          entry.rects.push(el);
        });
      }
    });

    // File sharing. Received files have their own list in the history dialog —
    // newest first, with a rolling limit, since nothing here is persisted:
    // a received file lives in this tab's memory as an object URL.
    const appendWithRollingLimit = (container, element, limit) => {
      container.insertBefore(element, container.firstChild);
      const files = container.querySelectorAll('.file-item');
      if (files.length > limit) files[files.length - 1].remove();
    };
    const MAX_HISTORY_ITEMS = 30; // rolling limit suggestion
    // WebRTC data channels cap message size (~256KB depending on the browser), so
    // larger files travel as ordered chunks reassembled per metadata.id — the
    // official GenosRTC best practice for file transfer.
    const FILE_CHUNK_BYTES = 64 * 1024;
    const incomingFiles = {};
    const renderReceivedFile = (metadata, payload, peerId) => {
      const blob = new Blob([payload], { type: metadata.type });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = metadata.name;
      link.textContent = `File from ${peerId}: ${metadata.name}`;
      link.className = 'file-item';
      appendWithRollingLimit(fileRowsHost, link, MAX_HISTORY_ITEMS);
    };
    fileChannel.on('message', (message, peerId) => {
      const { metadata, payload, chunk } = message || {};
      if (!metadata) return;
      if (!chunk) { renderReceivedFile(metadata, payload, peerId); return; } // small file: single message
      const entry = (incomingFiles[metadata.id] ??= { parts: [], received: 0 });
      entry.parts[chunk.seq] = payload;
      entry.received++;
      if (entry.received === chunk.total) {
        renderReceivedFile(metadata, new Blob(entry.parts), peerId);
        delete incomingFiles[metadata.id];
      }
    });

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        await db.sm.executeWithPermission("write"); // contributing content is for editors
        const buffer = await file.arrayBuffer();
        const metadata = { name: file.name, type: file.type, id: `file-${Date.now()}` };
        if (buffer.byteLength <= FILE_CHUNK_BYTES) {
          fileChannel.send({ metadata, payload: buffer });
        } else {
          const total = Math.ceil(buffer.byteLength / FILE_CHUNK_BYTES);
          for (let seq = 0; seq < total; seq++) {
            fileChannel.send({
              metadata,
              chunk: { seq, total },
              payload: buffer.slice(seq * FILE_CHUNK_BYTES, (seq + 1) * FILE_CHUNK_BYTES)
            });
          }
        }
      } catch (error) {
        toast('Error sharing file: ' + (error?.message || error), 'error');
      }
    });

    // ============================ Version history ============================
    // A version is a SIGNED graph node linked as a child of the doc
    // (db.link(docId, versionId)) and doubles as the governance metric:
    // `versionsSaved` on the user node climbs editors to admin.

    /** Aggregate the governance metric — spread keeps `role` intact, and the
     *  brief retry (dSocial's pattern) avoids clobbering a role that hasn't
     *  synced into this peer yet. */
    const bumpVersionsSaved = async () => {
      const id = `user:${myAddress}`;
      let node = null;
      for (let i = 0; i < 4 && !node; i++) {
        ({ result: node } = await db.get(id));
        if (!node) await new Promise(r => setTimeout(r, 400));
      }
      const base = node?.value ?? { ethAddress: myAddress, role: effectiveRole(null) };
      await db.put({ ...base, versionsSaved: (base.versionsSaved ?? 0) + 1 }, id);
    };

    saveVersionBtn.addEventListener('click', async () => {
      try {
        await db.sm.executeWithPermission("write");
        const versionId = `version-${Date.now()}`;
        await db.put({ type: 'version', content: getEditorHTML(), savedAt: Date.now(), author: myAddress }, versionId);
        await db.link(docId, versionId);
        await bumpVersionsSaved();
        flashSaved(); // the live subscription below renders the new row on every peer
      } catch (error) {
        toast('Error saving version: ' + (error?.message || error), 'error');
      }
    });

    const restoreVersion = async (versionId) => {
      if (!can('write')) return toast('The editor role is required to restore versions', 'error');
      const { result: node } = await db.get(versionId);
      if (!node?.value) return;
      setEditorHTML(node.value.content || '');
      updateWordCount();
      updatePreview();
      const ts = Date.now();
      if (ts > lastTimestamp) lastTimestamp = ts;
      docChannel.send({ content: getEditorHTML(), ts });
      try {
        await db.sm.executeWithPermission("write");
        await db.put({ content: getEditorHTML() }, docId); // restoring persists
        flashSaved();
      } catch {
        toast('Not saved — the editor role is required', 'error');
      }
    };

    const deleteVersion = async (versionId) => {
      try {
        await db.sm.executeWithPermission("deleteAny"); // admin moderation
        await db.remove(versionId);
        toast('Version deleted');
      } catch (error) {
        toast(error?.message || 'Delete failed', 'error');
      }
    };

    // LIVE version list. Versions are children of the doc, so the doc is the
    // $edge starting point and the sub-query filters its descendants. The
    // realtime engine re-evaluates the traversal on every graph change:
    // versions saved or deleted by ANY peer appear here instantly, no reload.
    const versions = new Map(); // id → value (fed by the live subscription)

    renderVersions = () => {
      versionRowsHost.innerHTML = '';
      const ordered = [...versions.entries()]
        .sort((a, b) => (b[1].savedAt ?? 0) - (a[1].savedAt ?? 0))
        .slice(0, MAX_HISTORY_ITEMS);
      for (const [id, v] of ordered) {
        const row = document.createElement('div');
        row.className = 'version-row';
        const restore = document.createElement('button');
        restore.textContent = `Version ${new Date(v.savedAt ?? 0).toLocaleString()}`;
        if (v.author) restore.title = `Saved by ${shortAddr(v.author)}`;
        restore.addEventListener('click', () => restoreVersion(id));
        row.appendChild(restore);
        if (can('deleteAny')) {
          const del = document.createElement('button');
          del.className = 'version-del';
          del.textContent = '×';
          del.title = 'Delete version (admin)';
          del.addEventListener('click', () => deleteVersion(id));
          row.appendChild(del);
        }
        versionRowsHost.appendChild(row);
      }
    };

    db.map({
      query: { id: docId, $edge: { type: 'version' } },
      field: 'savedAt',
      order: 'desc'
    }, ({ id, value, action }) => {
      action === 'removed' ? versions.delete(id) : versions.set(id, value);
      renderVersions();
    });



    // Initial status
    updateStatus();
    autoGrow(); // the browser may restore field content across reloads

    // Initial auth state: if the SM silently resumed a session before our
    // callback was registered, hydrate the UI from the current state; otherwise
    // boot as a read-only guest. No interactive WebAuthn prompt on load.
    //
    // This one call also opens the door when there is no session — nothing else
    // calls showModal(), so signed-out has exactly one code path.
    try {
      onSecurityState({
        isActive: db.sm.isSecurityActive(),
        activeAddress: db.sm.getActiveEthAddress?.() ?? null,
        abbrAddr: db.sm.abbrAddr?.(db.sm.getActiveEthAddress?.() ?? '') ?? '',
        hasVolatileIdentity: !!db.sm.getMnemonicForDisplayAfterRegistrationOrRecovery?.(),
        isWebAuthnProtected: db.sm.isCurrentSessionProtectedByWebAuthn?.() ?? false,
        hasWebAuthnHardwareRegistration: db.sm.hasExistingWebAuthnRegistration?.() ?? false
      });
    } catch { }
    applyPermissionsToUI();

    // Leave the room on real unload only — never pagehide (tab-freeze fires it).
    addEventListener('beforeunload', () => db.room?.leave?.());

  </script>
</body>

</html>
