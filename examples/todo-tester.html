<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenosDB — Automated tester (write pressure)</title>

    <style>
        /* Dark, because this page is data and measurement rather than an
           interface built to be read: the background disappears and the stream
           of operations carries the page. Same token names as every other
           example — only the values differ. */
        :root {
            --bg-primary: #0d0f12;
            --bg-secondary: #14171c;
            --bg-tertiary: #1c2026;
            --bg-elevated: #22262d;

            --text-primary: #e8eaed;
            --text-secondary: #9aa3ad;
            --text-tertiary: #5c6570;

            --accent: #4c8dff;
            --accent-hover: #6ba1ff;
            --ok: #34c77b;
            --warn: #f5a623;
            --danger: #ef5350;

            --border-subtle: #262b33;
            --border-strong: #333a44;

            --text-on-accent: #ffffff;
            --backdrop: rgba(0, 0, 0, .6);

            --radius-sm: 6px;
            --radius-lg: 14px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;

            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
        }

        /* Values only — not one component rule below changes with the theme. */
        [data-theme="light"] {
            --bg-primary: #f4f6fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f3f7;
            --bg-elevated: #ffffff;

            --text-primary: #1a1d24;
            --text-secondary: #6b7280;
            --text-tertiary: #9aa1ad;

            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --ok: #16a34a;
            --warn: #b45309;
            --danger: #dc2626;

            --border-subtle: #e4e7ee;
            --border-strong: #d4d9e3;

            --backdrop: rgba(26, 29, 36, .45);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh; /* the mobile address bar is not part of the viewport */
            overflow: hidden;
            font: 14px/1.5 var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* ── An instrument, not a page ──────────────────────────── */
        /* Chrome at the edges, the stream edge to edge between them, and the
           page itself never scrolls — only the log does. Boxing the stream
           would waste exactly the space the data was going to occupy. */
        .layout {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            height: 100%;
        }

        /* Every chrome band is 48px tall, so top bar and status bar read as one
           system rather than two near-misses. The stats row is deliberately
           taller: it carries two lines per figure. */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            min-height: 48px;
            padding: var(--space-2) var(--space-5);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand {
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* The database under test, named in the chrome: this page writes into
           the same graph as the todolist examples, and that is the whole point. */
        .brand span { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--text-tertiary); }

        .controls { display: flex; align-items: center; gap: var(--space-2); }

        /* Chrome-sized, not content-sized: a band is 48px, and a button at its
           default padding is 37px tall — which with the band's own padding
           would push it to 54 and break the rhythm against the status bar. */
        .controls button { padding: 6px var(--space-3); }

        /* Its own label, inline — no page-wide `label` rule, which would reach
           into the dialog and stack its text as a block. */
        .interval { display: flex; align-items: center; gap: var(--space-2); margin: 0; color: var(--text-secondary); font-size: 12px; }

        /* `[type]` in the selector is not decoration: `.interval input` ties on
           specificity with the base `input[type="number"]` rule and loses on
           document order, so the field would take its full 100% width. */
        .interval input[type="number"] { width: 84px; padding: 6px var(--space-2); font-family: var(--mono); font-size: 13px; }

        .icon-btn {
            display: flex;
            padding: 6px;
            margin-right: -6px; /* aligns the mark with the edge, not the hit area */
            background: none;
            border: none;
            color: var(--text-secondary);
        }

        .icon-btn:hover:not(:disabled) { color: var(--text-primary); border-color: transparent; }
        .icon-btn svg { width: 16px; height: 16px; }

        /* One icon per preference, chosen by what was asked for — not by the
           palette in force, or `system` could not draw itself. */
        .icon-moon, .icon-system { display: none; }
        [data-pref="dark"] .icon-sun { display: none; }
        [data-pref="dark"] .icon-moon { display: block; }
        [data-pref="system"] .icon-sun { display: none; }
        [data-pref="system"] .icon-system { display: block; }

        /* ── The figures ────────────────────────────────────────── */
        /* A row of stats with mono values — the vocabulary every GenosDB
           instrument shares. No cards: a rule under the row separates it, and
           the space around each figure does the rest. */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-6);
            padding: var(--space-3) var(--space-5);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
        }

        .stat { display: flex; flex-direction: column; margin: 0; }
        .stat b { font-family: var(--mono); font-size: 20px; font-weight: 600; line-height: 1.2; }
        .stat span { font-size: 12px; color: var(--text-tertiary); }

        .stat.inserted b { color: var(--ok); }
        .stat.updated b { color: var(--accent); }
        .stat.deleted b { color: var(--warn); }
        /* Zero errors is the normal state, so it stays quiet until it is not. */
        .stat.errors b { color: var(--text-primary); }
        .stat.errors.has-errors b { color: var(--danger); }

        /* ── The stream ─────────────────────────────────────────── */
        /* Newest first: a running instrument is read at its top edge, and
           following the tail of an autoscrolling list is a chore. */
        .log {
            min-height: 0;
            overflow-y: auto;
            padding: var(--space-3) var(--space-5);
            font-family: var(--mono);
            font-size: 13px;
        }

        /* Three aligned columns instead of a sentence: when 400 lines scroll
           past, the eye reads the column, never the line. No separators — the
           alignment already does that job, and 100 rules would be noise. */
        .log-entry {
            display: grid;
            grid-template-columns: auto 56px minmax(0, 1fr);
            gap: var(--space-3);
            padding: 3px 0;
        }

        .log-time { color: var(--text-tertiary); }
        .log-kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
        .log-detail { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }

        .insert .log-kind { color: var(--ok); }
        .update .log-kind { color: var(--accent); }
        .delete .log-kind { color: var(--warn); }
        .error .log-kind { color: var(--danger); }
        .note .log-kind { color: var(--text-tertiary); }

        .log-id { color: var(--text-primary); }

        /* ── Status bar — what is true, never what you can do ───── */
        .statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            min-height: 48px;
            padding: var(--space-2) var(--space-5);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .run-state { display: flex; align-items: center; gap: var(--space-2); margin: 0; font-family: var(--mono); }

        /* The one thing an instrument must state without being read: whether it
           is alive. Grey and still while idle, green and breathing while it runs. */
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-tertiary); }
        .running .dot { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }

        @keyframes pulse { 50% { opacity: .25; } }

        @media (prefers-reduced-motion: reduce) {
            .running .dot { animation: none; }
        }

        /* ── Buttons ────────────────────────────────────────────── */
        /* Secondary is the default and blue is opt-in: make `button` itself the
           primary one and `button:hover` paints a fill that outranks every
           `.icon-btn:hover`, so the theme icon lights up as a blue square. */
        button {
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }

        button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-hover); }
        button:disabled { opacity: .45; cursor: not-allowed; }

        button.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
        button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--text-on-accent); }

        button.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
        button.ghost:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-strong); }

        button.danger { background: transparent; border-color: var(--border-strong); color: var(--danger); }
        button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

        /* The base every field sits on. `number` belongs here with the rest: a
           specific rule states only what makes a field different, so leaving a
           type out of the base means re-inventing padding and border by hand. */
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: var(--space-2) var(--space-3);
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-secondary);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            outline: none;
        }

        input:focus { border-color: var(--accent); }
        input:disabled { color: var(--text-tertiary); background: var(--bg-primary); }

        /* ── Confirmation dialog ────────────────────────────────── */
        dialog {
            width: min(440px, calc(100vw - var(--space-6)));
            padding: var(--space-6);
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            text-align: center;
        }

        dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }

        .modal-title { margin: 0 0 var(--space-3); font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
        .modal-hint { margin: 0 0 var(--space-5); font-size: 14px; color: var(--text-secondary); }
        .modal-actions { display: flex; flex-direction: column; gap: var(--space-2); }
        .modal-actions button { width: 100%; padding: 13px var(--space-4); font-size: 14px; font-weight: 600; }

        /* Wrapping, not shrinking: the controls stay pressable and the stream
           keeps whatever height is left. */
        @media (max-width: 760px) {
            .topbar { flex-wrap: wrap; padding-bottom: var(--space-3); }
            .controls { flex-wrap: wrap; }
            .stats { gap: var(--space-4) var(--space-5); }
            .log { padding-inline: var(--space-4); }
        }
    </style>
</head>

<body>

    <div class="layout">
        <header class="topbar">
            <h1 class="brand">Automated tester <span>todoList</span></h1>

            <div class="controls">
                <p class="interval">
                    <label for="op-speed">every</label>
                    <input type="number" id="op-speed" value="2000" min="100" step="100" aria-label="Operation interval in milliseconds">
                    ms
                </p>
                <button id="start-ops" class="primary">Start</button>
                <button id="stop-ops" disabled>Stop</button>
                <button id="clear-all" class="danger">Clear all</button>

                <button id="theme-btn" class="icon-btn" title="Theme" aria-label="Theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                    </svg>
                    <svg class="icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="13" rx="2" />
                        <path d="M9 21h6" />
                    </svg>
                </button>
            </div>
        </header>

        <section class="stats" aria-label="Operations performed">
            <p class="stat"><b id="stat-total">0</b><span>operations</span></p>
            <p class="stat inserted"><b id="stat-inserted">0</b><span>inserted</span></p>
            <p class="stat updated"><b id="stat-updated">0</b><span>updated</span></p>
            <p class="stat deleted"><b id="stat-deleted">0</b><span>deleted</span></p>
            <p class="stat errors" id="stat-errors-box"><b id="stat-errors">0</b><span>errors</span></p>
        </section>

        <div id="log" class="log" role="log" aria-live="off"></div>

        <footer class="statusbar">
            <p class="run-state" id="run-state"><span class="dot"></span><span id="run-label">Idle</span></p>
            <span id="presence">0 peers</span>
        </footer>
    </div>

    <!-- Confirmation before anything irreversible. Never window.confirm: it
         blocks the thread, which in a P2P app freezes the very sync being
         demonstrated — rAF included, so the interface stops updating too. -->
    <dialog id="confirm-modal">
        <h2 class="modal-title" id="confirm-title"></h2>
        <p class="modal-hint" id="confirm-text"></p>
        <form method="dialog" class="modal-actions">
            <button value="ok" id="confirm-ok" class="danger"></button>
            <button value="cancel" class="ghost">Cancel</button>
        </form>
    </dialog>

    <script type="module">
        /**
         * Write pressure, on purpose.
         *
         * This page opens the same database as the todolist examples and drives
         * a stream of random writes into it. Open `todolist.html` in another
         * window, press Start here, and the list over there fills, changes and
         * empties on its own — replication with nobody typing.
         *
         * What to read here, and where:
         *   · db.put(value)        — a new node; its id comes back
         *   · db.put(value, id)    — an update, addressed by that id
         *   · db.remove(id)        — a deletion, replicated like any other write
         *   · db.map({})           — every node, once, no subscription kept
         *
         * The whole file is a writer: it never subscribes, because what watches
         * the result is the other window. That asymmetry is the demonstration.
         */
        import { gdb } from "../dist/index.js"

        const DB_NAME = "todoList" // the graph the todolist examples open
        const MIN_INTERVAL = 100
        const MAX_LOG_ENTRIES = 200

        const $ = (id) => document.getElementById(id)
        const el = {
            themeBtn: $("theme-btn"),
            speed: $("op-speed"),
            start: $("start-ops"),
            stop: $("stop-ops"),
            clear: $("clear-all"),
            log: $("log"),
            runState: $("run-state"),
            runLabel: $("run-label"),
            presence: $("presence"),
            confirmModal: $("confirm-modal"),
            confirmTitle: $("confirm-title"),
            confirmText: $("confirm-text"),
            confirmOk: $("confirm-ok")
        }

        const stats = { total: 0, inserted: 0, updated: 0, deleted: 0, errors: 0 }
        const statEls = {
            total: $("stat-total"), inserted: $("stat-inserted"), updated: $("stat-updated"),
            deleted: $("stat-deleted"), errors: $("stat-errors")
        }

        // Only the ids this tester created. It shares the graph with whoever
        // else is writing, and updating or deleting a node a person is editing
        // in the other window would be indistinguishable from a bug.
        let ownIds = []
        let timerId = null

        /** Bumps a counter and repaints just that figure. */
        const count = (kind) => {
            stats[kind]++
            stats.total++
            statEls[kind].textContent = stats[kind]
            statEls.total.textContent = stats.total
            if (kind === "errors") $("stat-errors-box").classList.add("has-errors")
        }

        /** One line in the stream: time, kind, detail — three aligned columns. */
        const log = (kind, detail, id = "") => {
            const entry = document.createElement("div")
            entry.className = `log-entry ${kind}`

            const time = document.createElement("span")
            time.className = "log-time"
            time.textContent = new Date().toLocaleTimeString()

            const label = document.createElement("span")
            label.className = "log-kind"
            label.textContent = kind.toUpperCase()

            // textContent throughout: a node's text can come from a peer, and
            // there is no server in a P2P app to have sanitized it for you.
            const text = document.createElement("span")
            text.className = "log-detail"
            if (id) {
                const short = document.createElement("b")
                short.className = "log-id"
                short.textContent = id.slice(0, 8)
                text.append(short, ` ${detail}`)
            } else text.textContent = detail

            entry.append(time, label, text)
            el.log.prepend(entry)
            while (el.log.children.length > MAX_LOG_ENTRIES) el.log.lastChild.remove()
        }

        const confirmAction = ({ title, body, confirmLabel }) => new Promise((resolve) => {
            el.confirmTitle.textContent = title
            el.confirmText.textContent = body
            el.confirmOk.textContent = confirmLabel
            el.confirmModal.addEventListener(
                "close",
                () => resolve(el.confirmModal.returnValue === "ok"),
                { once: true } // Esc and the backdrop both land here, as a "no"
            )
            el.confirmModal.showModal()
        })

        /**
         * Theme: values only. `data-theme` is the palette in force, which the CSS
         * paints from; `data-pref` is what the reader asked for, and only it can
         * tell "dark because I chose it" from "dark because the OS is".
         */
        const THEME_ORDER = ["system", "light", "dark"]
        const systemTheme = matchMedia("(prefers-color-scheme: light)")

        const applyTheme = (pref) => {
            const root = document.documentElement
            root.dataset.pref = pref
            root.dataset.theme = pref === "system" ? (systemTheme.matches ? "light" : "dark") : pref
            localStorage.testerTheme = pref
            el.themeBtn.title = `Theme: ${pref}`
        }

        systemTheme.addEventListener("change", () => {
            if (document.documentElement.dataset.pref === "system") applyTheme("system")
        })

        applyTheme(localStorage.testerTheme ?? "system")
        el.themeBtn.addEventListener("click", () => {
            const next = (THEME_ORDER.indexOf(document.documentElement.dataset.pref) + 1) % THEME_ORDER.length
            applyTheme(THEME_ORDER[next])
        })

        // `rtc: true` is the point of this page: every write below has to leave
        // the machine for the other window to show it.
        const db = await gdb(DB_NAME, { rtc: true })

        // ── The three operations ────────────────────────────────────
        const insert = async () => {
            const text = `Random Task #${Math.floor(Math.random() * 1000)} (from Tester)`
            const id = await db.put({ text, completed: Math.random() < .3 })
            ownIds.push(id)
            count("inserted")
            log("insert", `"${text}"`, id)
        }

        const update = async () => {
            const id = ownIds[Math.floor(Math.random() * ownIds.length)]
            const text = `UPDATED Task ${Math.floor(Math.random() * 500)} (from Tester)`
            const completed = Math.random() < .5

            // Same call as an insert, with the id as second argument: in GenosDB
            // a write addressed to an existing node replaces its value.
            await db.put({ text, completed }, id)
            count("updated")
            log("update", `"${text}" · completed: ${completed}`, id)
        }

        const remove = async () => {
            const id = ownIds.splice(Math.floor(Math.random() * ownIds.length), 1)[0]
            await db.remove(id)
            count("deleted")
            log("delete", "removed from the graph", id)
        }

        /**
         * Weighted so the graph grows overall — otherwise the run empties itself
         * and every operation becomes an insert. Below three nodes there is
         * nothing of ours to update or delete, so it only inserts.
         */
        const performOperation = async () => {
            const roll = Math.random()
            const operation = ownIds.length < 3 || roll < .5 ? insert : roll < .75 ? update : remove
            try {
                await operation()
            } catch (error) {
                count("errors")
                log("error", error.message)
            }
        }

        // ── Run state ───────────────────────────────────────────────
        /** Clamps to a value the interval can honour, and writes it back. */
        const readInterval = () => {
            const value = Math.max(MIN_INTERVAL, parseInt(el.speed.value) || 2000)
            el.speed.value = value
            return value
        }

        const setRunning = (running, interval) => {
            el.runState.classList.toggle("running", running)
            el.runLabel.textContent = running ? `Running · every ${interval} ms` : "Idle"
            el.start.disabled = running
            el.stop.disabled = !running
            el.clear.disabled = running // clearing mid-run would race its own writes
            el.speed.disabled = running
        }

        const start = () => {
            if (timerId) return
            const interval = readInterval()
            timerId = setInterval(performOperation, interval)
            setRunning(true, interval)
            log("note", `Started — one operation every ${interval} ms.`)
        }

        const stop = () => {
            if (!timerId) return
            clearInterval(timerId)
            timerId = null
            setRunning(false)
            log("note", "Stopped.")
        }

        el.start.addEventListener("click", start)
        el.stop.addEventListener("click", stop)

        el.speed.addEventListener("change", () => log("note", `Interval set to ${readInterval()} ms.`))

        el.clear.addEventListener("click", async () => {
            const confirmed = await confirmAction({
                title: "Delete every task?",
                body: `Not only this tester's: the whole '${DB_NAME}' graph empties, on every open window.`,
                confirmLabel: "Delete all"
            })
            if (!confirmed) return

            el.clear.disabled = true
            el.start.disabled = true
            try {
                // One read, no subscription: unsubscribe immediately or this page
                // keeps a live query it will never look at again.
                const { results, unsubscribe } = await db.map({})
                unsubscribe?.()

                // Removed one by one rather than with db.clear(): a remove is a
                // write every peer replicates, which is what the other window is
                // here to show. db.clear() is local and resets the watermark.
                for (const { id } of results ?? []) {
                    await db.remove(id)
                    count("deleted")
                    log("delete", "cleared", id)
                }
                ownIds = []
                log("note", `Cleared ${results?.length ?? 0} tasks.`)
            } catch (error) {
                count("errors")
                log("error", error.message)
            } finally {
                el.clear.disabled = false
                el.start.disabled = false
            }
        })

        // ── Presence ────────────────────────────────────────────────
        // getPeers() returns an object keyed by peer id, not a Map.
        const updatePresence = () => {
            const peers = Object.keys(db.room?.getPeers() ?? {}).length
            el.presence.textContent = `${peers} ${peers === 1 ? "peer" : "peers"}`
        }

        db.room?.on("peer:join", updatePresence)
        db.room?.on("peer:leave", updatePresence)
        updatePresence()

        log("note", `Ready. Open todolist.html in another window to watch the writes arrive.`)
    </script>
</body>

</html>
